services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
      - ./.cache:/app/.cache
      - ./forecasting_qa_news_metaculus_2025-02-01_to_today.metaculus_frs_format.json:/app/forecasting_qa_news_metaculus_2025-02-01_to_today.metaculus_frs_format.json:ro
    environment:
      - SCADS_AI_API_KEY
      - HF_TOKEN
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns

volumes:
  mlflow-data:
