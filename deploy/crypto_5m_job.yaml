apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: crypto-5m-collector
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      template:
        spec:
          serviceAccountName: 664177666636-compute@developer.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 240
          containers:
          - image: us-central1-docker.pkg.dev/brave-drive-471109-d9/docker/analyzing-llm-rationale:sha-f7e6600
            command:
            - python
            args:
            - scripts/crypto_5m_tick.py
            - --symbols
            - BTC,ETH,SOL
            - --signal-log
            - /mnt/crypto/crypto_5m/signal_log.jsonl
            - --signal-db
            - /tmp/crypto_5m_signals.sqlite
            - --equity-out
            - /mnt/crypto/crypto_5m/equity_payload.json
            - --keep-days
            - "7"
            - --hours
            - "72"
            - --market-probability
            - "0.50"
            - --fee-bps
            - "2"
            - --ml-mode
            - adaptive
            - --lookback-minutes
            - "60"
            - --training-window
            - "120"
            - --strategy-mode
            - per_asset_regime_selector
            - --momentum-threshold
            - "0.0025"
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
            volumeMounts:
            - name: crypto
              mountPath: /mnt/crypto
          volumes:
          - name: crypto
            csi:
              driver: gcsfuse.run.googleapis.com
              volumeAttributes:
                bucketName: brave-drive-471109-d9-models
