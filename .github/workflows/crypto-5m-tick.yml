name: Crypto 5m tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-5m-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Advance crypto 5m paper dataset
        run: |
          PYTHONPATH=src python scripts/crypto_5m_tick.py \
            --symbols BTC,ETH,SOL \
            --signal-log data/crypto_5m_signal_log.jsonl \
            --signal-db data/crypto_5m_signals.sqlite \
            --equity-out static/crypto_5m_equity_payload.json \
            --keep-days 7 \
            --hours 0 \
            --market-probability 0.50 \
            --fee-bps 2 \
            --ml-mode adaptive \
            --lookback-minutes 60 \
            --training-window 120 \
            --strategy-mode per_asset_regime_selector \
            --momentum-threshold 0.0025

      - name: Commit updated crypto chart data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto_5m_signal_log.jsonl static/crypto_5m_equity_payload.json
          if git diff --cached --quiet; then
            echo "No crypto 5m changes to commit."
            exit 0
          fi
          git commit -m "crypto 5m: tick [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
