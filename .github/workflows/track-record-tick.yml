name: Track record price tick

# Cheap 15-minute heartbeat: records price points, scores newly-resolved markets,
# and refreshes the public aggregate. No LLM calls — always completes in < 10 min.
# LLM forecast snapshots are handled by track-record-forecast.yml (every 6 h).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-record
  cancel-in-progress: false

jobs:
  price-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests duckdb

      - name: Record price points
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODELS: "gpt-oss-120b,gemma-4-31b-it,kimi-k2.6,council,crowd-follow"
        run: python scripts/track_record_tick.py --price-only

      - name: Commit updated track record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/track_record_store.duckdb static/track_record_live.json
          if git diff --cached --quiet; then
            echo "No track-record changes to commit."
            exit 0
          fi
          git commit -m "track record: price tick [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
