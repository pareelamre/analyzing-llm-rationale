name: Track record MTM tick

# Cheap 15-minute heartbeat: records price points, scores newly-resolved markets,
# and refreshes the public aggregate. No LLM calls — always completes in < 10 min.
# LLM forecast snapshots are handled by track-record-forecast.yml (hourly).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-record-mtm
  cancel-in-progress: false

jobs:
  price-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Record price points and publish MTM
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODEL: "council"
          CYCLE_INTERVAL_MINUTES: "15"
        run: python scripts/track_record_tick.py --mtm-only

      - name: Commit updated MTM artifact
        env:
          GIT_REBASE_KEEP_THEIRS: "data/track_record_store.duckdb,static/mark_to_market_live.json"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/track_record_store.duckdb static/mark_to_market_live.json
          if git diff --cached --quiet; then
            echo "No MTM changes to commit."
            exit 0
          fi
          git commit -m "track record: mtm tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
