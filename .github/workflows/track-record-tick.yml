name: Track record MTM tick

# Cheap 5-minute heartbeat: records price points, scores newly-resolved markets,
# and refreshes the public aggregate. No LLM calls — always completes in < 10 min.
# LLM forecast snapshots are handled by track-record-forecast.yml (hourly).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  TRACK_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store
  TRACK_STORE_OBJECT: track_record_store.duckdb

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-record-mtm
  cancel-in-progress: false

jobs:
  price-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: track-record-store-gcs-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download track record store
        run: gcloud storage cp "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" data/track_record_store.duckdb

      - name: Record price points and publish MTM
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODEL: "council"
          CYCLE_INTERVAL_MINUTES: "5"
        run: python scripts/track_record_tick.py --mtm-only

      - name: Upload track record store
        run: gcloud storage cp data/track_record_store.duckdb "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT"

      - name: Commit updated MTM artifact
        env:
          GIT_REBASE_KEEP_THEIRS: "static/mark_to_market_live.json"
          MTM_PUBLISH_DEPLOY_KEY_B64: ${{ secrets.MTM_PUBLISH_DEPLOY_KEY_B64 }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          printf '%s' "$MTM_PUBLISH_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/mtm_publish_deploy_key
          chmod 600 ~/.ssh/mtm_publish_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config core.sshCommand "ssh -i ~/.ssh/mtm_publish_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote set-url origin git@github.com:pareelamre/analyzing-llm-rationale.git
          git add static/mark_to_market_live.json
          if git diff --cached --quiet; then
            echo "No MTM changes to commit."
            exit 0
          fi
          git commit -m "track record: mtm tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
