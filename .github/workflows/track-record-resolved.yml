name: Track record resolved quality

# Cheap resolved-quality pass: score newly resolved markets, sync the immutable
# ledger, and publish the resolved forecast-quality aggregate. No LLM calls and
# no mark-to-market artifact writes.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-record-resolved
  cancel-in-progress: false

jobs:
  resolved-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Score resolved forecasts
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODEL: "council"
          CYCLE_INTERVAL_MINUTES: "15"
        run: python scripts/track_record_tick.py --resolved-only

      - name: Commit resolved-quality artifacts
        env:
          GIT_REBASE_KEEP_THEIRS: "data/track_record_store.duckdb,static/track_record_live.json,static/forecast_evaluation.json"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/track_record_store.duckdb static/track_record_live.json static/forecast_evaluation.json
          if git diff --cached --quiet; then
            echo "No resolved-quality changes to commit."
            exit 0
          fi
          git commit -m "track record: resolved quality [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
