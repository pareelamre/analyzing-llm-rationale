name: Track record resolved quality

# Cheap resolved-quality pass: score newly resolved markets, sync the immutable
# ledger, and publish the resolved forecast-quality aggregate. No LLM calls and
# no mark-to-market artifact writes.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  TRACK_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store
  TRACK_STORE_OBJECT: track_record_store.duckdb

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-record-resolved
  cancel-in-progress: false

jobs:
  resolved-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: track-record-store-gcs-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-instrumentation-requests

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download track record store
        run: gcloud storage cp "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" data/track_record_store.duckdb

      - name: Score resolved forecasts
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODEL: "council"
          CYCLE_INTERVAL_MINUTES: "15"
        run: python scripts/track_record_tick.py --resolved-only

      - name: Upload track record store
        run: gcloud storage cp data/track_record_store.duckdb "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT"

      # Additive, like the MTM tick: published to GCS *and* still committed,
      # until the server is verified reading the GCS copy. track_record_live
      # carries ~2,800 revisions of a 2.7MB file.
      - name: Publish track-record payloads to GCS
        if: env.TRACK_RECORD_PAYLOAD_BUCKET != ''
        env:
          TRACK_RECORD_PAYLOAD_BUCKET: ${{ vars.TRACK_RECORD_PAYLOAD_BUCKET }}
        run: |
          for f in track_record_live forecast_evaluation; do
            gcloud storage cp "static/$f.json"               "gs://$TRACK_RECORD_PAYLOAD_BUCKET/$f.json"               --cache-control="no-cache, max-age=0"
          done

      - name: Commit resolved-quality artifacts
        env:
          GIT_REBASE_KEEP_THEIRS: "static/track_record_live.json,static/forecast_evaluation.json"
          MTM_PUBLISH_DEPLOY_KEY_B64: ${{ secrets.MTM_PUBLISH_DEPLOY_KEY_B64 }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          printf '%s' "$MTM_PUBLISH_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/mtm_publish_deploy_key
          chmod 600 ~/.ssh/mtm_publish_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config core.sshCommand "ssh -i ~/.ssh/mtm_publish_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote set-url origin git@github.com:pareelamre/analyzing-llm-rationale.git
          git add static/track_record_live.json static/forecast_evaluation.json
          if git diff --cached --quiet; then
            echo "No resolved-quality changes to commit."
            exit 0
          fi
          git commit -m "track record: resolved quality [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
