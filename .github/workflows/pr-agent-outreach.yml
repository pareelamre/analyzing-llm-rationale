name: PR agent outreach

# Legacy outreach utility. It remains manually available for an explicit
# outreach campaign, but no longer consumes a recurring GitHub Actions slot.

on:
  workflow_dispatch:
    inputs:
      resend:
        description: "Re-send to targets already present in state"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-agent-outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Run PR agent outreach
        env:
          PR_AGENT_TARGET_AUTH: ${{ secrets.PR_AGENT_TARGET_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resend_flag=""
          if [ "${{ github.event.inputs.resend }}" = "true" ]; then
            resend_flag="--resend"
          fi
          python scripts/pr_agent_outreach.py \
            --targets data/pr_outreach_targets.json \
            --state data/pr_outreach_state.json \
            --send \
            --discover \
            --out data/pr_outreach_last_run.json \
            $resend_flag

      - name: Commit outreach state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pr_outreach_targets.json data/pr_outreach_state.json data/pr_outreach_last_run.json
          if git diff --cached --quiet; then
            echo "No outreach state changes to commit."
            exit 0
          fi
          git commit -m "pr agent: outreach tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
