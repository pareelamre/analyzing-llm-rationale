name: Datastore backup

# Daily recovery point for Cloud Datastore (users, conversations, analytics,
# trading state).
#
# PRIVACY: this repository is PUBLIC. GitHub Actions artifacts on a public repo
# are downloadable by anyone with a GitHub account, and this export contains
# user emails, OAuth ids (alt_subs), and private chat conversations. The backup
# therefore goes ONLY to the private Cloudflare R2 bucket -- never to an
# artifact, release asset, or commit. See the agent coordination log in
# AGENTS.md.
#
# The export is a portable SQLite file produced by the same copier used for the
# VPS migration, so a recovery point is directly restorable into the SQL
# backend. The GCS bucket keeps its 30-day lifecycle rule as a second recovery
# point until the VPS cutover retires Datastore entirely.

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch: {}

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  R2_PREFIX: datastore-backups
  RETENTION_DAYS: "7"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require a private destination
        # A green run that stored the backup nowhere is worse than a red one.
        env:
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: |
          if [ -z "${R2_STATE_BUCKET}" ]; then
            echo "::error::R2_STATE_BUCKET is unset; refusing to run a backup with no private destination."
            exit 1
          fi

      - name: Install export dependencies
        run: |
          pip install google-cloud-datastore==2.20.2 google-auth==2.35.0 \
                      boto3==1.43.108

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Export Datastore to SQLite
        env:
          PYTHONPATH: src
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          python scripts/migrate_datastore_to_sql.py \
            --project "${GCP_PROJECT_ID}" \
            --output "foresea-${STAMP}.sqlite3"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Verify the export (advisory)
        env:
          PYTHONPATH: src
        run: |
          # Advisory, not fatal. The twin runtime writes TwinPublicEvidenceCache
          # and TwinResearchCapture every ~5 minutes, so counts drift between
          # export and verify. Point-in-time drift is expected; a large
          # discrepancy is not, so it is surfaced without failing the run.
          python scripts/migrate_datastore_to_sql.py --verify \
            --project "${GCP_PROJECT_ID}" \
            --output "foresea-${STAMP}.sqlite3" || \
            echo "::warning::verify reported drift (expected for live twin kinds); inspect the log above"

      - name: Record export metadata
        run: |
          python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path

          path = Path(f"foresea-{os.environ['STAMP']}.sqlite3")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with sqlite3.connect(path) as db:
              kinds = dict(db.execute(
                  "SELECT kind, COUNT(*) FROM entities GROUP BY kind ORDER BY kind"
              ).fetchall())
              total = sum(kinds.values())
          meta = {
              "date": os.environ["STAMP"],
              "bytes": path.stat().st_size,
              "sha256": digest,
              "entities": total,
              "kinds": kinds,
          }
          Path("backup-manifest.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(f"{total} entities across {len(kinds)} kinds, sha256={digest[:16]}...")
          PY

      - name: Upload to the private R2 bucket
        env:
          PYTHONPATH: src
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os
          from analyzing_llm_rationale.r2_store import get_client

          client = get_client()
          bucket = os.environ["R2_STATE_BUCKET"]
          prefix = f"{os.environ['R2_PREFIX']}/{os.environ['STAMP']}/"
          for name in (f"foresea-{os.environ['STAMP']}.sqlite3", "backup-manifest.json"):
              key = prefix + name
              client.upload_file(name, bucket, key)
              head = client.head_object(Bucket=bucket, Key=key)
              print(f"uploaded {key} ({head['ContentLength']} bytes)")
          PY

      - name: Expire recovery points older than the retention window
        env:
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, re
          from datetime import datetime, timedelta, timezone
          from analyzing_llm_rationale.r2_store import get_client

          client = get_client()
          bucket = os.environ["R2_STATE_BUCKET"]
          prefix = os.environ["R2_PREFIX"] + "/"
          cutoff = datetime.now(timezone.utc).date() - timedelta(
              days=int(os.environ["RETENTION_DAYS"])
          )
          expired = []
          for page in client.get_paginator("list_objects_v2").paginate(
              Bucket=bucket, Prefix=prefix
          ):
              for obj in page.get("Contents", []):
                  match = re.fullmatch(
                      re.escape(prefix) + r"(\d{4}-\d{2}-\d{2})/.*", obj["Key"]
                  )
                  if match and datetime.strptime(match[1], "%Y-%m-%d").date() < cutoff:
                      expired.append(obj["Key"])
          for key in expired:
              client.delete_object(Bucket=bucket, Key=key)
          print(f"expired {len(expired)} object(s) older than {cutoff}")
          PY
