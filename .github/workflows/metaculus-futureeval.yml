name: Metaculus FutureEval bots

on:
  schedule:
    # Off the hour to reduce GitHub's peak-time cron delays. Times are UTC.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit live tournament forecasts for all four bots"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: metaculus-futureeval-bots
  cancel-in-progress: false

jobs:
  forecast:
    # Automated live dispatches must respect the execution kill switch.
    # Explicit manual previews remain available with submit=false.
    if: vars.METACULUS_BOTS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.submit != true)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: src
      AUDIT_PATH: results/${{ matrix.audit_file }}
      METACULUS_AUDIT_GCS_URI: gs://brave-drive-471109-d9-track-record-store/metaculus/fall-futureeval-2026/${{ matrix.profile }}.jsonl
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - profile: qwen-primary
            token_secret: METACULUS_QWEN_TOKEN
            username_secret: METACULUS_QWEN_USERNAME
            token_env: METACULUS_QWEN_TOKEN
            username_env: METACULUS_QWEN_USERNAME
            audit_file: metaculus_qwen_primary_audit.jsonl
          - profile: gemma-secondary
            token_secret: METACULUS_GEMMA_TOKEN
            username_secret: METACULUS_GEMMA_USERNAME
            token_env: METACULUS_GEMMA_TOKEN
            username_env: METACULUS_GEMMA_USERNAME
            audit_file: metaculus_gemma_secondary_audit.jsonl
          - profile: glm-secondary
            token_secret: METACULUS_GLM_TOKEN
            username_secret: METACULUS_GLM_USERNAME
            token_env: METACULUS_GLM_TOKEN
            username_env: METACULUS_GLM_USERNAME
            audit_file: metaculus_glm_secondary_audit.jsonl
          - profile: deepseek-secondary
            token_secret: METACULUS_DEEPSEEK_TOKEN
            username_secret: METACULUS_DEEPSEEK_USERNAME
            token_env: METACULUS_DEEPSEEK_TOKEN
            username_env: METACULUS_DEEPSEEK_USERNAME
            audit_file: metaculus_deepseek_secondary_audit.jsonl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hosted bot dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes -r requirements-metaculus-hosted.txt

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Restore write-ahead audit
        run: |
          python -m analyzing_llm_rationale.metaculus_audit_storage restore "$AUDIT_PATH" "$METACULUS_AUDIT_GCS_URI"

      - name: Forecast and submit
        env:
          BOT_TOKEN: ${{ secrets[matrix.token_secret] }}
          BOT_USERNAME: ${{ secrets[matrix.username_secret] }}
          PROFILE_TOKEN_ENV: ${{ matrix.token_env }}
          PROFILE_USERNAME_ENV: ${{ matrix.username_env }}
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
          LIVE_SUBMIT: ${{ (github.event_name == 'schedule' || inputs.submit == true) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.METACULUS_BOTS_ENABLED == 'true' }}
        run: |
          if [[ -z "$BOT_TOKEN" || -z "$BOT_USERNAME" || -z "$SCADS_AI_API_KEY" ]]; then
            echo "::error::Missing a required Metaculus bot identity or SCADS secret."
            exit 1
          fi
          export "$PROFILE_TOKEN_ENV=$BOT_TOKEN"
          export "$PROFILE_USERNAME_ENV=$BOT_USERNAME"
          submit_args=()
          if [[ "$LIVE_SUBMIT" == "true" ]]; then
            submit_args=(--submit --confirm-submit "SUBMIT METACULUS FORECASTS")
          fi
          python -c 'from analyzing_llm_rationale.cli import main; raise SystemExit(main())' forecast-metaculus \
            --bot-profile "${{ matrix.profile }}" \
            --tournament fall-futureeval-2026 \
            --max-questions 5 \
            --refresh-forecasted \
            --audit-log-path "$AUDIT_PATH" \
            "${submit_args[@]}"
