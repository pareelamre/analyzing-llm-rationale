name: Track record forecast snapshots

# Cost-capped scheduled pass: LLM forecast snapshots for selected open markets.
# Each model runs as an isolated matrix job and uploads its own DuckDB store.
# A single downstream publish job merges the successful model artifacts and
# pushes once, avoiding parallel write contention on main.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reforecast_each_tick:
        description: "Force re-forecast all open markets regardless of slot (1=yes, 0=no)"
        required: false
        default: "0"
      target_shard_count:
        description: "Number of rotating market/target shards"
        required: false
        default: "4"
      target_shard_index:
        description: "0-based target shard to run; blank rotates from the 5-minute slot"
        required: false
        default: ""
      max_targets:
        description: "Maximum markets to forecast in this run"
        required: false
        default: "15"

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  TRACK_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store
  TRACK_STORE_OBJECT: track_record_store.duckdb

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-record-forecast
  cancel-in-progress: false

jobs:
  forecast:
    name: forecast (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      # SCADS currently caps this API key at 2 simultaneous requests. Each
      # matrix job below is limited to one in-flight /predict call, so two
      # jobs is the safe global fan-out.
      max-parallel: 2
      matrix:
        include:
          - model: crowd-follow
            artifact: crowd-follow
          - model: council
            artifact: council
          - model: scads-alias-code
            artifact: scads-alias-code
          - model: scads-alias-ha
            artifact: scads-alias-ha
          - model: scads-alias-reasoning
            artifact: scads-alias-reasoning
          - model: scads-alias-huge
            artifact: scads-alias-huge
          - model: scads-alias-huge-no-thinking
            artifact: scads-alias-huge-no-thinking
          - model: llama-3.3-70b-instruct
            artifact: llama-3.3-70b-instruct
          - model: gpt-oss-120b
            artifact: gpt-oss-120b
          - model: gemma-4-31b-it
            artifact: gemma-4-31b-it
          - model: minimax-m3
            artifact: minimax-m3
          - model: kimi-k2.7-code
            artifact: kimi-k2.7-code
          - model: qwen3-coder-30b-a3b-instruct
            artifact: qwen3-coder-30b-a3b-instruct
          - model: glm-5.2-fp8
            artifact: glm-5.2-fp8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Verify forecast secrets
        env:
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
        run: |
          if [ -z "$SCADS_AI_API_KEY" ]; then
            echo "::error::SCADS_AI_API_KEY must be configured as a GitHub Actions secret for GitHub-hosted forecasts."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare isolated model store
        run: |
          mkdir -p tmp/model-forecast
          gcloud storage cp "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" "tmp/model-forecast/${{ matrix.artifact }}.duckdb"

      - name: Advance model forecast snapshots
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_STORE_PATH: tmp/model-forecast/${{ matrix.artifact }}.duckdb
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TRACK_RECORD_PREDICT_MODE: "local"
          TRACK_RECORD_LOCAL_MODEL: "gpt-oss-120b"
          TRACK_MODEL: ${{ matrix.model }}
          TRACK_MODELS: ${{ matrix.model }}
          TRACK_MODEL_SHARD_COUNT: "1"
          TRACK_MODEL_SHARD_INDEX: "0"
          TRACK_MODEL_SHARD_ALWAYS: ""
          TRACK_MODEL_SHARD_SLOT_MINUTES: "5"
          TRACK_TARGET_SHARD_COUNT: ${{ github.event.inputs.target_shard_count || '4' }}
          TRACK_TARGET_SHARD_INDEX: ${{ github.event.inputs.target_shard_index || '' }}
          TRACK_TARGET_SHARD_SLOT_MINUTES: "5"
          TRACK_FORECAST_MAX_TARGETS: ${{ github.event.inputs.max_targets || '15' }}
          PER_VENUE: "2"
          CONVERGENCE_PER_VENUE: "100"
          REFORECAST_EACH_TICK: ${{ github.event.inputs.reforecast_each_tick || '1' }}
          CYCLE_INTERVAL_MINUTES: "5"
          SNAPSHOT_SLOT_MINUTES: "5"
          TRACK_RECORD_EVIDENCE_DETAIL: "summary"
          PRICE_DRIFT_THRESHOLD: "0.10"
          SHORT_HORIZON_REFORECAST_LEAD_DAYS: "90"
          SHORT_HORIZON_SLOT_HOURS: "24"
          EXPIRY_REFORECAST_LEAD_DAYS: "3"
          EXPIRY_SLOT_HOURS: "6"
          MAX_TOKENS: "4096"
          PROVIDER_TIMEOUT_S: "300"
          PROVIDER_MAX_RETRIES: "1"
          PROVIDER_BACKOFF_BASE_S: "4"
          COUNCIL_MEMBER_TIMEOUT_S: "180"
          PREDICT_TIMEOUT_S: "300"
          PREDICT_CONCURRENCY: "1"
          PREDICT_MIN_INTERVAL_S: "8.0"
          PREDICT_RETRIES: "2"
          PREDICT_RETRY_BACKOFF_BASE_S: "20"
          PREDICT_RETRY_BACKOFF_MAX_S: "300"
          PREDICT_FAILURE_CIRCUIT_THRESHOLD: "2"
          TRACK_RECORD_SNAPSHOT_PASS_RETRIES: "1"
          TRACK_RECORD_SNAPSHOT_PASS_RETRY_SLEEP_S: "0"
        run: python scripts/track_record_tick.py --snapshot-only

      - name: Upload model forecast store
        uses: actions/upload-artifact@v4
        with:
          name: track-record-store-${{ matrix.artifact }}
          path: tmp/model-forecast/${{ matrix.artifact }}.duckdb
          if-no-files-found: error
          retention-days: 2

  publish:
    name: publish forecast snapshots
    needs: forecast
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: track-record-store-gcs-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Download model forecast stores
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: track-record-store-*
          path: tmp/model-forecast-artifacts
          merge-multiple: false

      - name: Publish forecast snapshots and refresh MTM
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_MODEL: "council"
          CYCLE_INTERVAL_MINUTES: "5"
          MTM_PUBLISH_DEPLOY_KEY_B64: ${{ secrets.MTM_PUBLISH_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$MTM_PUBLISH_DEPLOY_KEY_B64" ]; then
            mkdir -p ~/.ssh
            printf '%s' "$MTM_PUBLISH_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/mtm_publish_deploy_key
            chmod 600 ~/.ssh/mtm_publish_deploy_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git config core.sshCommand "ssh -i ~/.ssh/mtm_publish_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git remote set-url origin git@github.com:pareelamre/analyzing-llm-rationale.git
          fi

          mapfile -t forecast_stores < <(find tmp/model-forecast-artifacts -type f -name '*.duckdb' | sort)
          if [ "${#forecast_stores[@]}" -eq 0 ]; then
            echo "No model forecast artifacts were available to publish."
            exit 1
          fi
          printf 'Publishing %s model forecast stores:\n' "${#forecast_stores[@]}"
          printf ' - %s\n' "${forecast_stores[@]}"

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git checkout -B "forecast-publish-batch" origin/main
            gcloud storage cp "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" data/track_record_store.duckdb
            python scripts/merge_track_record_store.py \
              --target data/track_record_store.duckdb \
              "${forecast_stores[@]}"
            python scripts/track_record_tick.py --mtm-only
            gcloud storage cp data/track_record_store.duckdb "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT"
            git add static/mark_to_market_live.json
            if git diff --cached --quiet; then
              echo "No forecast snapshot changes to commit."
              exit 0
            fi
            git commit -m "track record: forecast batch [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt ${attempt}/8 failed; retrying."
            sleep $((attempt * 10))
          done
          echo "Failed to publish forecast snapshots." >&2
          exit 1
