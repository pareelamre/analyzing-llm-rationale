name: Track record forecast

# Cost-capped scheduled pass: LLM forecast snapshots for selected open markets
# and tracked models. Each run makes up to N_markets × N_models /predict calls.
# Uses the shared concurrency group so it never races a price-tick commit.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reforecast_each_tick:
        description: "Force re-forecast all open markets regardless of slot (1=yes, 0=no)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: track-record
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests duckdb

      - name: Advance live track record
        env:
          FORESEA_BASE_URL: https://foresea.ink
          PER_VENUE: "2"
          CONVERGENCE_PER_VENUE: "100"
          TRACK_MODELS: "gpt-oss-120b,gemma-4-31b-it,kimi-k2.6,council,crowd-follow"
          REFORECAST_EACH_TICK: ${{ github.event.inputs.reforecast_each_tick || '0' }}
          PRICE_DRIFT_THRESHOLD: "0.10"
          SHORT_HORIZON_REFORECAST_LEAD_DAYS: "90"
          SHORT_HORIZON_SLOT_HOURS: "24"
          EXPIRY_REFORECAST_LEAD_DAYS: "3"
          EXPIRY_SLOT_HOURS: "6"
        run: python scripts/track_record_tick.py

      - name: Commit updated track record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/track_record_store.duckdb static/track_record_live.json
          if git diff --cached --quiet; then
            echo "No track-record changes to commit."
            exit 0
          fi
          git commit -m "track record: forecast tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
