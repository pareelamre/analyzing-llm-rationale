name: Track record forecast

# Cost-capped scheduled pass: LLM forecast snapshots for selected open markets
# and tracked models. Each run makes up to N_markets × N_models /predict calls.
# Uses the shared concurrency group so it never races a price-tick commit.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      reforecast_each_tick:
        description: "Force re-forecast all open markets regardless of slot (1=yes, 0=no)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: track-record
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Verify forecast secrets
        env:
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
        run: |
          if [ -z "$SCADS_AI_API_KEY" ]; then
            echo "::error::SCADS_AI_API_KEY must be configured as a GitHub Actions secret for GitHub-hosted forecasts."
            exit 1
          fi

      - name: Advance live track record
        env:
          FORESEA_BASE_URL: https://foresea.ink
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TRACK_RECORD_PREDICT_MODE: "local"
          TRACK_RECORD_LOCAL_MODEL: "gpt-oss-120b"
          TRACK_MODEL: "council"
          PER_VENUE: "2"
          CONVERGENCE_PER_VENUE: "100"
          REFORECAST_EACH_TICK: ${{ github.event.inputs.reforecast_each_tick || '1' }}
          CYCLE_INTERVAL_MINUTES: "15"
          SNAPSHOT_SLOT_MINUTES: "15"
          PRICE_DRIFT_THRESHOLD: "0.10"
          SHORT_HORIZON_REFORECAST_LEAD_DAYS: "90"
          SHORT_HORIZON_SLOT_HOURS: "24"
          EXPIRY_REFORECAST_LEAD_DAYS: "3"
          EXPIRY_SLOT_HOURS: "6"
          MAX_TOKENS: "4096"
          PROVIDER_TIMEOUT_S: "300"
          PROVIDER_MAX_RETRIES: "4"
          PROVIDER_BACKOFF_BASE_S: "4"
          COUNCIL_MEMBER_TIMEOUT_S: "180"
          PREDICT_TIMEOUT_S: "600"
          PREDICT_CONCURRENCY: "2"
          PREDICT_MIN_INTERVAL_S: "4.0"
          PREDICT_RETRIES: "5"
          PREDICT_RETRY_BACKOFF_BASE_S: "20"
          PREDICT_RETRY_BACKOFF_MAX_S: "300"
          PREDICT_FAILURE_CIRCUIT_THRESHOLD: "12"
          TRACK_RECORD_SNAPSHOT_PASS_RETRIES: "3"
          TRACK_RECORD_SNAPSHOT_PASS_RETRY_SLEEP_S: "300"
        run: python scripts/track_record_tick.py

      - name: Commit updated track record
        env:
          GIT_REBASE_KEEP_THEIRS: "data/track_record_store.duckdb,static/track_record_live.json,static/forecast_evaluation.json"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/track_record_store.duckdb static/track_record_live.json static/forecast_evaluation.json
          if git diff --cached --quiet; then
            echo "No track-record changes to commit."
            exit 0
          fi
          git commit -m "track record: forecast tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
