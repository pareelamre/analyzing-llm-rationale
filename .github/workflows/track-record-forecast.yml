name: Track record forecast snapshots

# Cost-capped scheduled pass: LLM forecast snapshots for selected open markets.
# Each model runs as an isolated matrix job and uploads its own DuckDB store.
# A single downstream publish job merges the successful model artifacts and
# pushes once, avoiding parallel write contention on main.
#
# Since 2026-11-08 the forecasts come from the on-device model
# (qwen3.5-9b-selfhosted on the owner's Mac, reached over Tailscale), once a
# night: the hourly scheduler dispatch only forecasts in the 22:00 IST hour,
# so the Mac also has room for the site's live chat and the agent's 02:00 and
# 14:00 IST cycles. SCADS access ended on 2026-11-03, taking the council with
# it. Nothing runs until TRACK_RECORD_FORECAST_ENABLED is 'true'.
# Already-recorded snapshots keep resolving via track-record-tick/resolved.

on:
  workflow_dispatch:
    inputs:
      reforecast_each_tick:
        description: "Force re-forecast all open markets regardless of slot (1=yes, 0=no)"
        required: false
        default: "0"
      target_shard_count:
        description: "Number of rotating market/target shards"
        required: false
        default: "4"
      target_shard_index:
        description: "0-based target shard to run; blank rotates from the 5-minute slot"
        required: false
        default: ""
      max_targets:
        description: "Maximum markets to forecast in this run"
        required: false
        default: "12"
      any_hour:
        description: "Forecast now instead of waiting for the 22:00 IST hour (1=yes, 0=no)"
        required: false
        default: "0"

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  FORESEA_STORAGE_BACKEND: ${{ vars.FORESEA_STORAGE_BACKEND || 'gcs' }}
  R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
  R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
  PYTHONPATH: src
  TRACK_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store
  TRACK_STORE_OBJECT: track_record_store.duckdb

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-record-forecast-provider-slot
  cancel-in-progress: false

jobs:
  roster:
    name: build active MTM model roster
    # Every later job needs this one, so skipping it skips the forecasts.
    if: ${{ vars.TRACK_RECORD_FORECAST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run: ${{ steps.window.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Forecast once a night, in the 22:00 IST hour
        id: window
        shell: bash
        run: |
          hour="$(TZ=Asia/Kolkata date +%H)"
          if [ "$hour" = "22" ] || [ "${{ github.event.inputs.any_hour || '0' }}" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 22:00 IST forecast hour (now ${hour}:xx IST); nothing to do."
          fi
      - name: Resolve the canonical Agentic model roster
        id: matrix
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          # The council was SCADS models only; the on-device agent forecasts alone.
          matrix="$(PYTHONPATH=src python -c "import json; from pathlib import Path; from analyzing_llm_rationale.config import scads_agent_trading_model_labels; labels = ['crowd-follow', *scads_agent_trading_model_labels(Path('configs/models.yaml'))]; print(json.dumps({'include': [{'model': label, 'artifact': label} for label in labels]}, separators=(',', ':'))) ")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  prepare-targets:
    needs: roster
    if: ${{ needs.roster.outputs.run == 'true' }}
    name: prepare unified forecast targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-instrumentation-requests

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare isolated read-only store for target discovery
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p tmp/prepare-targets
          python -m analyzing_llm_rationale.r2_store cp --allow-missing "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" "tmp/prepare-targets/store.duckdb"

      - name: Discover and prepare unified target contexts
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_STORE_PATH: tmp/prepare-targets/store.duckdb
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          # One nightly pass covers every target, so there is one shard.
          TRACK_TARGET_SHARD_COUNT: ${{ github.event.inputs.target_shard_count || '1' }}
          TRACK_TARGET_SHARD_INDEX: ${{ github.event.inputs.target_shard_index || '' }}
          TRACK_TARGET_SHARD_SLOT_MINUTES: "5"
          TRACK_FORECAST_MAX_TARGETS: ${{ github.event.inputs.max_targets || '12' }}
          PER_VENUE: "2"
          CONVERGENCE_PER_VENUE: "100"
          REFORECAST_EACH_TICK: ${{ github.event.inputs.reforecast_each_tick || '0' }}
        run: |
          python scripts/track_record_tick.py --prepare-targets-only tmp/prepare-targets/targets.json

      - name: Upload prepared forecast targets
        uses: actions/upload-artifact@v4
        with:
          name: forecast-targets
          path: tmp/prepare-targets/targets.json
          retention-days: 2

  forecast:
    needs: [roster, prepare-targets]
    if: ${{ needs.roster.outputs.run == 'true' }}
    name: forecast (${{ matrix.model }})
    runs-on: ubuntu-latest
    # 12 targets at up to five minutes a forecast on the Mac, with headroom.
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      # crowd-follow (no model) runs beside the on-device model.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.roster.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-instrumentation-requests

      - name: Verify forecast secrets
        env:
          SELF_HOSTED_LLM_API_KEY: ${{ secrets.SELF_HOSTED_LLM_API_KEY }}
          SELF_HOSTED_LLM_URL: ${{ vars.SELF_HOSTED_LLM_URL }}
        run: |
          if [ -z "$SELF_HOSTED_LLM_API_KEY" ] || [ -z "$SELF_HOSTED_LLM_URL" ]; then
            echo "::error::The on-device model needs the SELF_HOSTED_LLM_API_KEY secret and the SELF_HOSTED_LLM_URL variable."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare isolated model store
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p tmp/model-forecast
          python -m analyzing_llm_rationale.r2_store cp "$TRACK_STORE_BUCKET/$TRACK_STORE_OBJECT" "tmp/model-forecast/${{ matrix.artifact }}.duckdb"

      - name: Download prepared forecast targets
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: forecast-targets
          path: tmp/prepared

      - name: Advance model forecast snapshots
        env:
          FORESEA_BASE_URL: https://foresea.ink
          TRACK_STORE_PATH: tmp/model-forecast/${{ matrix.artifact }}.duckdb
          TRACK_TARGETS_FILE: tmp/prepared/targets.json
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TRACK_RECORD_PREDICT_MODE: "local"
          # The on-device model, through the Mac's public Tailscale URL; its config
          # address is the Mac's own localhost. No page waits on this nightly batch,
          # so a forecast may take up to five minutes instead of the site's 90 s.
          TRACK_RECORD_LOCAL_MODEL: "qwen3.5-9b-selfhosted"
          SELF_HOSTED_LLM_API_KEY: ${{ secrets.SELF_HOSTED_LLM_API_KEY }}
          TRACK_RECORD_API_BASE_URL: ${{ vars.SELF_HOSTED_LLM_URL }}
          PROVIDER_TIMEOUT_CAP_S: "300"
          TRACK_MODEL: ${{ matrix.model }}
          TRACK_MODELS: ${{ matrix.model }}
          TRACK_MODEL_SHARD_COUNT: "1"
          TRACK_MODEL_SHARD_INDEX: "0"
          TRACK_MODEL_SHARD_ALWAYS: ""
          TRACK_MODEL_SHARD_SLOT_MINUTES: "5"
          TRACK_TARGET_SHARD_COUNT: ${{ github.event.inputs.target_shard_count || '1' }}
          TRACK_TARGET_SHARD_INDEX: ${{ github.event.inputs.target_shard_index || '' }}
          TRACK_TARGET_SHARD_SLOT_MINUTES: "5"
          TRACK_FORECAST_MAX_TARGETS: ${{ github.event.inputs.max_targets || '12' }}
          PER_VENUE: "2"
          CONVERGENCE_PER_VENUE: "100"
          # Scheduled runs rotate target shards. Full reforecasting remains an
          # explicit manual option rather than a recurring full batch.
          REFORECAST_EACH_TICK: ${{ github.event.inputs.reforecast_each_tick || '0' }}
          CYCLE_INTERVAL_MINUTES: "5"
          SNAPSHOT_SLOT_MINUTES: "5"
          TRACK_RECORD_EVIDENCE_DETAIL: "summary"
          # Rank evidence by meaning (sentence-transformers is in the pipeline extra);
          # word overlap alone ranked unrelated "$150 million" stories above the
          # Sotheby's sale an artwork market turned on.
          EVIDENCE_EMBEDDINGS: "1"
          PRICE_DRIFT_THRESHOLD: "0.10"
          SHORT_HORIZON_REFORECAST_LEAD_DAYS: "90"
          SHORT_HORIZON_SLOT_HOURS: "24"
          EXPIRY_REFORECAST_LEAD_DAYS: "3"
          EXPIRY_SLOT_HOURS: "6"
          # About eight tokens a second on the Mac: room for a full forecast in 300 s.
          MAX_TOKENS: "1536"
          PROVIDER_TIMEOUT_S: "300"
          PROVIDER_MAX_RETRIES: "1"
          PROVIDER_BACKOFF_BASE_S: "4"
          COUNCIL_MEMBER_TIMEOUT_S: "180"
          PREDICT_TIMEOUT_S: "300"
          PREDICT_CONCURRENCY: "1"
          PREDICT_MIN_INTERVAL_S: "8.0"
          PREDICT_RETRIES: "2"
          PREDICT_RETRY_BACKOFF_BASE_S: "20"
          PREDICT_RETRY_BACKOFF_MAX_S: "300"
          PREDICT_FAILURE_CIRCUIT_THRESHOLD: "2"
          TRACK_RECORD_SNAPSHOT_PASS_RETRIES: "1"
          TRACK_RECORD_SNAPSHOT_PASS_RETRY_SLEEP_S: "0"
        run: python scripts/track_record_tick.py --snapshot-only

      - name: Upload model forecast store
        uses: actions/upload-artifact@v4
        with:
          name: track-record-store-${{ matrix.artifact }}
          path: tmp/model-forecast/${{ matrix.artifact }}.duckdb
          if-no-files-found: error
          retention-days: 2

  publish:
    name: publish forecast snapshots
    needs: [roster, forecast]
    # `!cancelled()` discarded the whole run whenever a single model's job
    # timed out. Observed: 9 of 10 model forecasts succeeded, minimax-m3 hit
    # the 35-minute job timeout (which GitHub reports as cancelled), and the
    # nine completed forecasts were then thrown away unpublished. Roughly half
    # of all runs ended that way, which is why models added to the roster
    # accumulate no resolved record and cannot be judged worth trading. The
    # agent board publish already learned this: "Publishing must still occur
    # after a skipped, cancelled, or failed cycle."
    #
    # always() would also run it after the off switch skipped every forecast,
    # and it exits 1 when there are no model stores, so it carries the switch.
    if: ${{ always() && vars.TRACK_RECORD_FORECAST_ENABLED == 'true' && needs.roster.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Download model forecast stores
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: track-record-store-*
          path: tmp/model-forecast-artifacts
          merge-multiple: false

      # Each model's forecasts go to a staging area; the 15-minute MTM tick, which
      # already holds the store lock, merges them in and clears them
      # (track-record-tick.yml). Waiting here for that lock lost to the ticks:
      # GitHub cancels a queued job when a newer one asks for the same lock, and
      # a tick almost always does, so forecast batches were dropped unpublished.
      - name: Stage forecast snapshots for the next MTM tick
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mapfile -t forecast_stores < <(find tmp/model-forecast-artifacts -type f -name '*.duckdb' | sort)
          if [ "${#forecast_stores[@]}" -eq 0 ]; then
            echo "No model forecast artifacts were available to publish."
            exit 1
          fi
          for store in "${forecast_stores[@]}"; do
            name="$(basename "$store")"
            python -m analyzing_llm_rationale.r2_store cp "$store" \
              "$TRACK_STORE_BUCKET/track_record_staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${name}"
            echo "Staged ${name}; the next MTM tick merges it."
          done
