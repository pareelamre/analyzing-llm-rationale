name: Agent trading tick (reusable)

# Called by the 10 per-model agent-trading-tick-*.yml workflows (one model
# each, on its own schedule trigger) -- not run directly. Each caller drives
# exactly one model's shadow-trading cycle via scripts/agent_trading_tick.py,
# which gives the model real tool access (place_trade/web_search/manage_notes)
# instead of just scoring a probability.
#
# Each model gets its OWN GCS object (agent_trading_store__<model>.sqlite /
# agent_trading_notes__<model>.json) rather than sharing one file across all
# 10 -- with 10 independent, identically-scheduled runs, a shared file would
# need a cross-workflow concurrency lock, and 10 serialized runs (pip install
# + a multi-step LLM tool loop each) can plausibly take longer than the
# 15-minute cadence, growing an ever-deepening queue. Separate objects mean
# every model's read-modify-write cycle is independent of every OTHER
# model's -- no cross-model lock, no queue.
#
# That does NOT cover two runs of the SAME model overlapping (a slow run
# still in flight when the next 15-minute trigger fires, or a manual
# workflow_dispatch layered on top of a scheduled run) -- each would
# download the same starting store, decide independently, and upload back
# to the same GCS object, so whichever finishes last silently overwrites
# the other's trades. The per-model concurrency group below (matching the
# pattern every other GCS-synced workflow in this repo already uses, e.g.
# track-record-tick.yml) queues same-model runs instead of letting them race.
#
# Shadow (paper) trading only. FORESEA_AGENT_PLACE_TRADE_MODE is hard-pinned
# to "shadow" below and is never a workflow input -- no caller can override it.
# FORESEA_ENABLE_TRADING / FORESEA_ENABLE_BYO_TRADING (the real-money gates in
# trading.py) are intentionally never defined anywhere in this file.
#
# KALSHI_ACCESS_KEY_ID / KALSHI_PRIVATE_KEY are optional: they're used only
# for a read-only, authenticated fee-tiers lookup (benchmark_tools._kalshi_fee)
# so shadow fills are costed against Kalshi's real taker rate instead of a
# flat estimate -- no order is ever placed with them. If unset, the cycle
# falls back to the estimate automatically; nothing here requires them.

on:
  workflow_call:
    inputs:
      model:
        description: "configs/models.yaml key to trade as this cycle."
        required: true
        type: string

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  AGENT_TRADING_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store

permissions:
  contents: read
  actions: write

concurrency:
  group: agent-trading-tick-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  trade:
    name: trade (${{ inputs.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Verify secrets
        env:
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
        run: |
          if [ -z "$SCADS_AI_API_KEY" ]; then
            echo "::error::SCADS_AI_API_KEY must be configured as a GitHub Actions secret."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download this model's shadow account store (tolerant of first run)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          mkdir -p tmp/agent-trading
          gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_store__${MODEL}.sqlite" \
            tmp/agent-trading/store.sqlite \
            || echo "No existing store for ${MODEL} yet -- starting fresh."
          gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_notes__${MODEL}.json" \
            tmp/agent-trading/notes.json \
            || echo '{}' > tmp/agent-trading/notes.json

      - name: Write Kalshi credentials for the fee-tiers lookup (optional)
        # Empty when the secrets aren't configured -- benchmark_tools falls
        # back to its estimated fee formula if the resulting file/key is
        # missing or unusable, so this never blocks the cycle either way.
        env:
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: printf '%s' "$KALSHI_PRIVATE_KEY" > tmp/agent-trading/kalshi_private_key.pem

      - name: Run one shadow-trading cycle
        env:
          AGENT_TRADING_MODEL: ${{ inputs.model }}
          FORESEA_AGENT_PLACE_TRADE_MODE: shadow
          FORESEA_AGENT_ACCOUNT_DB_PATH: tmp/agent-trading/store.sqlite
          FORESEA_AGENT_NOTES_PATH: tmp/agent-trading/notes.json
          FORESEA_AGENT_TOOL_LEDGER_PATH: tmp/agent-trading/tool_ledger.jsonl
          FORESEA_AGENT_CYCLE_MINUTES: "15"
          FORESEA_AGENT_ACCOUNT_VALUE: "10000"
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KALSHI_ACCESS_KEY_ID: ${{ secrets.KALSHI_ACCESS_KEY_ID }}
          KALSHI_PRIVATE_KEY_FILE: tmp/agent-trading/kalshi_private_key.pem
          MAX_TOOL_STEPS: "4"
          CANDIDATE_COUNT: "3"
        run: python scripts/agent_trading_tick.py

      - name: Upload this model's shadow account store
        # Runs even if the tick step above failed partway through (e.g. a
        # trade was placed before a later step errored) so no successfully
        # recorded shadow trade is ever lost -- the job itself still reports
        # failure via the tick script's exit code.
        if: always()
        env:
          MODEL: ${{ inputs.model }}
        run: |
          gcloud storage cp tmp/agent-trading/store.sqlite \
            "$AGENT_TRADING_STORE_BUCKET/agent_trading_store__${MODEL}.sqlite"
          gcloud storage cp tmp/agent-trading/notes.json \
            "$AGENT_TRADING_STORE_BUCKET/agent_trading_notes__${MODEL}.json"

      - name: Fallback -- republish the public board if it's gone stale
        # agent-trading-board-publish.yml's own `schedule:` trigger is
        # best-effort like every GitHub Actions cron and can silently skip
        # firing under platform load (github.com/orgs/community/discussions/156282)
        # -- observed live: 3+ consecutive 15-minute triggers dropped in a
        # row, leaving the public board stuck for an hour with nothing
        # queued, in progress, or erroring anywhere to alert on. Each of the
        # 10 per-model tick workflows already runs on its own staggered
        # ~15-minute cadence, so a cheap staleness check piggybacked here
        # gives near-total redundancy: GitHub would have to drop the
        # board-publish trigger AND enough of these 10 simultaneously for
        # this fallback to also miss it.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_commit=$(git log -1 --format=%ct -- static/agent_trading_live.json)
          age=$(( $(date +%s) - last_commit ))
          echo "static/agent_trading_live.json was last published ${age}s ago"
          if [ "$age" -lt 1200 ]; then
            echo "Board is fresh enough -- nothing to do."
            exit 0
          fi
          in_progress=$(gh run list --workflow=agent-trading-board-publish.yml --status in_progress --json databaseId -q 'length')
          queued=$(gh run list --workflow=agent-trading-board-publish.yml --status queued --json databaseId -q 'length')
          if [ "${in_progress:-0}" -gt 0 ] || [ "${queued:-0}" -gt 0 ]; then
            echo "A board-publish run is already in flight -- not triggering another."
            exit 0
          fi
          echo "Board is stale (${age}s) and nothing is publishing it -- triggering a republish."
          gh workflow run agent-trading-board-publish.yml
