name: Agent trading tick (reusable)

# Called by the scheduled reserved-capacity dispatcher and by the manual per-model
# workflows. Each caller drives one or more isolated shadow-trading cycles via
# scripts/agent_trading_tick.py, which gives the model real tool access
# (place_trade/web_search/manage_notes) instead of just scoring a probability.
#
# Each model gets its OWN GCS object (agent_trading_store__<model>.sqlite /
# agent_trading_notes__<model>.json) rather than sharing one file across all
# 10 -- with 10 independent, identically-scheduled runs, a shared file would
# need a cross-workflow concurrency lock, and 10 serialized runs (pip install
# + a multi-step LLM tool loop each) can plausibly take longer than the
# 15-minute cadence, growing an ever-deepening queue. Separate objects mean
# every model's read-modify-write cycle is independent of every OTHER
# model's -- no cross-model lock, no queue.
#
# The single reserved agent slot covers same-model overlap too: a slow scheduled
# cycle or a manual workflow_dispatch cannot race another update to a model's
# GCS-synced ledger. This is separate from forecast capacity, so forecast work
# cannot consume the only pending slot and silently evict agent work.
#
# Shadow (paper) trading only. FORESEA_AGENT_PLACE_TRADE_MODE is hard-pinned
# to "shadow" below and is never a workflow input -- no caller can override it.
# FORESEA_ENABLE_TRADING / FORESEA_ENABLE_BYO_TRADING (the real-money gates in
# trading.py) are intentionally never defined anywhere in this file.
#
# KALSHI_ACCESS_KEY_ID / KALSHI_PRIVATE_KEY are optional: they're used only
# for a read-only, authenticated fee-tiers lookup (benchmark_tools._kalshi_fee)
# so shadow fills are costed against Kalshi's real taker rate instead of a
# flat estimate -- no order is ever placed with them. If unset, the cycle
# falls back to the estimate automatically; nothing here requires them.

on:
  workflow_call:
    inputs:
      models:
        description: "Space-separated configs/models.yaml keys to trade in this lane."
        required: true
        type: string
      lane:
        description: "Compatibility label for the caller. All agent callers share one reserved provider slot."
        required: true
        type: string

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  AGENT_TRADING_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store

concurrency:
  # Agent work permanently owns one of the two provider slots. Do not share
  # this group with forecast jobs: GitHub retains only one pending member of a
  # concurrency group, which previously replaced queued agent cycles.
  group: agent-trading-provider-slot
  cancel-in-progress: false

jobs:
  trade:
    name: trade (${{ inputs.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet -e ".[serve,pipeline]"
          requests duckdb pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - name: Verify secrets
        env:
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
        run: |
          if [ -z "$SCADS_AI_API_KEY" ]; then
            echo "::error::SCADS_AI_API_KEY must be configured as a GitHub Actions secret."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download this lane's isolated shadow account stores
        env:
          MODELS: ${{ inputs.models }}
        run: |
          for MODEL in $MODELS; do
            mkdir -p "tmp/agent-trading/$MODEL"
            gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_store__${MODEL}.sqlite" \
              "tmp/agent-trading/$MODEL/store.sqlite" \
              || echo "No existing store for ${MODEL} yet -- starting fresh."
            gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_notes__${MODEL}.json" \
              "tmp/agent-trading/$MODEL/notes.json" \
              || echo '{}' > "tmp/agent-trading/$MODEL/notes.json"
          done

      - name: Write Kalshi credentials for the fee-tiers lookup (optional)
        # Empty when the secrets aren't configured -- benchmark_tools falls
        # back to its estimated fee formula if the resulting file/key is
        # missing or unusable, so this never blocks the cycle either way.
        env:
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: printf '%s' "$KALSHI_PRIVATE_KEY" > tmp/agent-trading/kalshi_private_key.pem

      - name: Run every model in this lane and persist each result
        env:
          MODELS: ${{ inputs.models }}
          FORESEA_AGENT_PLACE_TRADE_MODE: shadow
          FORESEA_AGENT_CYCLE_MINUTES: "30"
          FORESEA_AGENT_ACCOUNT_VALUE: "10000"
          SCADS_AI_API_KEY: ${{ secrets.SCADS_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KALSHI_ACCESS_KEY_ID: ${{ secrets.KALSHI_ACCESS_KEY_ID }}
          KALSHI_PRIVATE_KEY_FILE: tmp/agent-trading/kalshi_private_key.pem
          MAX_TOOL_STEPS: "4"
          CANDIDATE_COUNT: "3"
          # agent_analyze owns bounded per-provider retries. Re-running the
          # complete tool loop after it exhausts them replays work and turns a
          # provider outage into a request storm.
          AGENT_TRADING_RETRIES: "1"
        run: |
          hard_failures=0
          provider_degradations=0
          for MODEL in $MODELS; do
            export AGENT_TRADING_MODEL="$MODEL"
            export FORESEA_AGENT_ACCOUNT_DB_PATH="tmp/agent-trading/$MODEL/store.sqlite"
            export FORESEA_AGENT_NOTES_PATH="tmp/agent-trading/$MODEL/notes.json"
            export FORESEA_AGENT_TOOL_LEDGER_PATH="tmp/agent-trading/$MODEL/tool_ledger.jsonl"
            if python scripts/agent_trading_tick.py; then
              :
            else
              status=$?
              if [ "$status" -eq 75 ]; then
                echo "::warning title=Agent provider degraded::${MODEL} could not complete because its upstream provider is unavailable; the ledger was persisted and the next model will still run."
                provider_degradations=$((provider_degradations + 1))
              else
                echo "::error title=Agent trading tick failed::${MODEL} failed outside the expected provider-degradation path; the next model will still run."
                hard_failures=$((hard_failures + 1))
              fi
            fi
            gcloud storage cp "tmp/agent-trading/$MODEL/store.sqlite" \
              "$AGENT_TRADING_STORE_BUCKET/agent_trading_store__${MODEL}.sqlite"
            gcloud storage cp "tmp/agent-trading/$MODEL/notes.json" \
              "$AGENT_TRADING_STORE_BUCKET/agent_trading_notes__${MODEL}.json"
          done
          if [ "$provider_degradations" -gt 0 ]; then
            echo "### Agent provider degradation" >> "$GITHUB_STEP_SUMMARY"
            echo "${provider_degradations} model cycle(s) were skipped because their upstream provider was unavailable. Individual model health and telemetry remain published on the Agentic board." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$hard_failures"
