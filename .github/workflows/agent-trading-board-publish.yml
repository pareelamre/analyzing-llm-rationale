name: Agent trading board publish

# Cheap aggregation-only heartbeat: no LLM calls, just reads all eight agent
# models' own GCS-synced shadow-account stores, fetches a live quote (Kalshi
# or Polymarket, matching each position's own venue) for whatever they
# currently hold, and republishes the public leaderboard/equity
# curve/transparency-feed JSON that GET /agent-trading/board serves. Runs less
# often than the per-model trade crons (staggered minutes 0-9) to avoid adding
# back the schedule pressure that agent-trading-cron-stagger and the
# crypto-5m-tick removal were meant to relieve.

on:
  schedule:
    # Aggregation-only refresh. Agent cycles are NOT triggered from here: the
    # Cloud Scheduler job foresea-tick-agent-trading dispatches those every 30
    # minutes. GitHub silently drops cron under load (three consecutive slots
    # were missed on 2026-09-05), and running both triggers together produced
    # four agent starts an hour, 12-18 minutes apart, against ticks that take
    # 20-40 -- which is how queued cycles were getting evicted.
    - cron: "27,57 * * * *"
  workflow_dispatch:
    inputs:
      run_agent_tick:
        description: "Run a shadow-agent cycle before publishing the board"
        required: false
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: brave-drive-471109-d9
  AGENT_TRADING_STORE_BUCKET: gs://brave-drive-471109-d9-track-record-store

permissions:
  contents: write
  pull-requests: write

concurrency:
  # GitHub keeps only ONE pending member per concurrency group: a third run
  # arriving while one is in flight and one is queued silently CANCELS the
  # queued one. Four runs an hour entered this group -- agent cycles at 12,42
  # and publish-only refreshes at 27,57 -- against a tick that takes 20-40
  # minutes, so queued agent cycles were routinely evicted by a refresh that
  # does no agent work at all (see the `if:` on agent-tick below, which skips
  # it for the 27,57 schedule). Two manual ticks were lost this way before the
  # cause was found. Publishing touches no provider slot, so it does not
  # belong in the same queue as the cycle it would displace.
  group: >-
    agent-trading-board-publish-${{
      (github.event_name == 'schedule' && github.event.schedule == '27,57 * * * *')
      && 'aggregate' || 'agent' }}
  cancel-in-progress: false

jobs:
  agent-tick:
    # Use this workflow's proven heartbeat as the agent dispatcher. The other
    # two quarterly-hour publishes stay aggregation-only, keeping the board
    # fresh without starting an extra trading pass.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_agent_tick == true }}
    uses: ./.github/workflows/agent-trading-tick.yml
    secrets: inherit

  publish:
    needs: [agent-tick]
    # Publishing must still occur after a skipped, cancelled, or failed agent
    # cycle so the UI can surface its true stale/degraded health state.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: >-
          pip install --quiet requests pyyaml
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          opentelemetry-instrumentation-logging
          opentelemetry-instrumentation-requests

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download every model's shadow account store
        run: |
          set -u
          models="deepseek-v4-flash gemma-4-26b-a4b-it glm-5-3 glm-5-3-flash gpt-oss-120b llama-3.3-70b-instruct minimax-m3 qwen3-8-27b"
          for model in $models; do
            mkdir -p "tmp/agent-trading-board/$model"
            gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_store__${model}.sqlite" \
              "tmp/agent-trading-board/$model/store.sqlite" \
              || echo "no store yet for $model, board builder will use an empty account for it"
            gcloud storage cp "$AGENT_TRADING_STORE_BUCKET/agent_trading_notes__${model}.json" \
              "tmp/agent-trading-board/$model/notes.json" \
              || echo "no notes yet for $model"
          done

      - name: Build the public agent-trading board
        env:
          # The scheduler runs one complete eight-model cycle every 30 minutes.
          # Health labels must reflect that committed cadence, not the old
          # 15-minute shared-lane schedule.
          AGENT_TRADING_MODEL_HEALTH_EXPECTED_CYCLE_SECONDS: "1800"
          AGENT_TRADING_MODEL_HEALTH_DELAYED_AFTER_SECONDS: "5400"
          AGENT_TRADING_MODEL_HEALTH_STALE_AFTER_SECONDS: "28800"
        run: PYTHONPATH=src python scripts/build_agent_trading_board.py

      - name: Build the on-demand paper-trade audit index
        # This is intentionally separate from the board payload. It reads the
        # durable, per-model SQLite ledgers in the background and publishes a
        # bounded audit window plus append-only monthly GitHub archives that
        # /agent-trading/audits can read on demand.
        run: PYTHONPATH=src python scripts/build_agent_trading_audit.py

      - name: Commit updated board artifact
        env:
          # Comma-delimited exact paths; the audit directory suffix also
          # allows individual monthly archive files to resolve safely.
          GIT_REBASE_KEEP_THEIRS: "static/agent_trading_live.json,static/agent_trading_audit_live.json,static/agent_trading_audit_archive_manifest.json,static/agent_trading_audits/"
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MTM_PUBLISH_DEPLOY_KEY_B64: ${{ secrets.MTM_PUBLISH_DEPLOY_KEY_B64 }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          printf '%s' "$MTM_PUBLISH_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/mtm_publish_deploy_key
          chmod 600 ~/.ssh/mtm_publish_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config core.sshCommand "ssh -i ~/.ssh/mtm_publish_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote set-url origin git@github.com:pareelamre/analyzing-llm-rationale.git
          git add static/agent_trading_live.json static/agent_trading_audit_live.json static/agent_trading_audit_archive_manifest.json static/agent_trading_audits
          if git diff --cached --quiet; then
            echo "No agent-trading board changes to commit."
            exit 0
          fi
          git commit -m "agent trading: board publish [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
