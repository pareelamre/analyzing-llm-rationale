name: Agent trading tick

# The reliable board-publisher heartbeat calls this workflow twice hourly. It
# remains manually runnable, but does not depend on its own GitHub cron: a
# missed scheduler event must not silently stall all agent cycles.
#
# A single dispatcher prevents eight separate cold starts. Agent trading owns one
# of the two SCADS provider slots; forecast snapshots own the other.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  trade:
    strategy:
      fail-fast: false
      # One serial lane plus one serial forecast lane keeps scheduled work
      # within SCADS' two-request account cap.
      max-parallel: 1
      matrix:
        include:
          - lane: "reserved"
            models: "qwen3.5-9b-selfhosted"
    uses: ./.github/workflows/_agent-trading-tick-reusable.yml
    with:
      lane: ${{ matrix.lane }}
      models: ${{ matrix.models }}
    secrets: inherit
