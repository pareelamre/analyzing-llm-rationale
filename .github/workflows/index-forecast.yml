name: Index range forecasts

# Daily NSE index range forecasts from Upstox closes and India VIX (open data
# routes, no secret). Forecasts can only be recorded between the close they use
# (15:30 IST) and the next session's open (09:15 IST), so the slots cover
# 18:30-09:07 IST. GitHub drops most scheduled slots here
# (docs/SCHEDULED_WORKFLOW_DELIVERY.md), hence one every half hour; the script
# fetches nothing once the latest close is published.

on:
  schedule:
    - cron: "7,37 13-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even when today's forecasts are already published"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: index-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet 'numpy>=1.26' requests

      - name: Forecast and score
        run: python scripts/index_forecast_tick.py ${{ inputs.force && '--force' || '' }}

      - name: Commit forecasts
        env:
          GIT_REBASE_KEEP_THEIRS: "static/index_forecast_live.json,data/index_forecast_ledger.jsonl"
          MTM_PUBLISH_DEPLOY_KEY_B64: ${{ secrets.MTM_PUBLISH_DEPLOY_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add static/index_forecast_live.json data/index_forecast_ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          printf '%s' "$MTM_PUBLISH_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/mtm_publish_deploy_key
          chmod 600 ~/.ssh/mtm_publish_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config core.sshCommand "ssh -i ~/.ssh/mtm_publish_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote set-url origin git@github.com:pareelamre/analyzing-llm-rationale.git
          git commit -m "index forecast: daily tick [skip ci]"
          bash .github/scripts/push_with_rebase_retry.sh origin main
