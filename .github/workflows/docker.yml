name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: brave-drive-471109-d9
  SERVICE_NAME: analyzing-llm-rationale

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      gar_image: ${{ steps.gar_tag.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build-push-action defaults to attaching provenance/SBOM attestations,
          # whose extra manifest entries are the common cause of "unknown blob"
          # failures when pushing a large image to GHCR (and to two registries at
          # once). Disable them — Cloud Run just needs the image.
          provenance: false
          sbom: false

      - name: Capture GAR image tag
        id: gar_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker/${{ env.SERVICE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ needs.build-and-push.outputs.gar_image }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --timeout 180 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 3 \
            --concurrency 20 \
            --cpu-throttling \
            --cpu-boost \
            --update-secrets SCADS_AI_API_KEY=SCADS_AI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,SESSION_SECRET=SESSION_SECRET:latest \
            --update-env-vars MODEL_DEVICE=cpu,CUSTOM_DOMAIN=foresea.ink,EMBED_MODEL_PATH=/app/models/all-MiniLM-L6-v2,CRYPTO_5M_EQUITY_FILE=/app/models/crypto_5m/equity_payload.json,INTERACTIVE_DEFAULT_MODEL=gemma-4-31b-it,INTERACTIVE_MAX_TOKENS=384,CHAT_PROVIDER_TIMEOUT_S=15,CHAT_PROVIDER_MAX_RETRIES=0,EVIDENCE_TIMEOUT_S=0,EVIDENCE_MAX_CONCURRENCY=4 \
            --remove-env-vars MARKETD_URL \
            --project ${{ env.GCP_PROJECT_ID }}
          # The RAG embedding model is served from a GCS volume mounted at
          # /app/models (volume 'models' -> gs://brave-drive-471109-d9-models),
          # set out-of-band via `gcloud run services update --add-volume`.
          # `gcloud run deploy` preserves volumes it isn't told to change, so the
          # mount persists across deploys; EMBED_MODEL_PATH is re-asserted above.

      - name: Resolve service URL
        id: service
        shell: bash
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Service URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed streaming path
        shell: bash
        env:
          SERVICE_URL: https://foresea.ink
        run: |
          curl -fsS "${SERVICE_URL}/health"
          # `gcloud run deploy` reporting "100 percent of traffic" only means
          # traffic is *routed* to the new revision -- with --min-instances 0
          # the container itself is still cold-starting (loading the RAG
          # embedding model, etc.) at that point, and the custom domain adds
          # its own routing hop on top. Hitting /predict/stream immediately
          # raced that cold start and got a transient 405 (the ASGI router
          # not fully registered yet), not a real regression. /ready flips to
          # 200 only once the app has actually finished initializing, so poll
          # it first instead of assuming deploy-success means request-ready.
          echo "Waiting for ${SERVICE_URL}/ready ..."
          for attempt in $(seq 1 30); do
            if curl -fsS "${SERVICE_URL}/ready" > /dev/null; then
              echo "Service ready after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Service did not become ready within 150s."
              exit 1
            fi
            sleep 5
          done
          python scripts/measure_forecast_latency.py \
            --url "${SERVICE_URL}" \
            --mode stream \
            --models minimax-m3 \
            --runs 3 \
            --no-attach-evidence \
            --max-tokens 64 \
            --timeout 60 > stream-latency.json
          cat stream-latency.json
          python - <<'PY'
          import json

          payload = json.load(open("stream-latency.json", "r", encoding="utf-8"))
          successes = [
              row for row in payload["rows"]
              if row.get("status") == 200
              and row.get("first_delta_ms") is not None
              and row.get("done_ms") is not None
              and row.get("model_key") == "minimax-m3"
          ]
          assert successes, f"no successful streamed response: {payload['rows']}"
          print("stream latency smoke test passed")
          PY
