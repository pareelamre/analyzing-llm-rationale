name: marketd (Go)

# Build + vet + test the Go market-data ingestion microservice, and (on main)
# deploy it to its own private Cloud Run service. It's an optional accelerator
# for the main app -- Python's in-process market_data path is the fallback and
# stays the source of truth if marketd is ever unreachable (fail-open, see
# _marketd_search_sync/_marketd_quotes_sync in server.py) -- but it's the only
# path for order book depth, candles, and the batch-quote endpoint
# (GET /market/batch), so it does need to actually run.
on:
  push:
    branches: [main]
    paths: ["services/marketd/**", ".github/workflows/marketd.yml"]
  pull_request:
    paths: ["services/marketd/**"]

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: brave-drive-471109-d9
  SERVICE_NAME: marketd

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image (Cloud Build)
        working-directory: services/marketd
        run: |
          gcloud builds submit \
            --tag "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker/${{ env.SERVICE_NAME }}:sha-$(git rev-parse --short HEAD)" \
            --project ${{ env.GCP_PROJECT_ID }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker/${{ env.SERVICE_NAME }}:sha-$(git rev-parse --short HEAD)" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8090 \
            --timeout 30 \
            --cpu 1 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 40 \
            --project ${{ env.GCP_PROJECT_ID }}
          # Private (no --allow-unauthenticated): only the main service's
          # runtime account may invoke it (roles/run.invoker, granted
          # out-of-band -- gcloud run deploy doesn't touch IAM bindings, so
          # this persists across deploys same as the volume mount noted in
          # docker.yml). Scale-to-zero (min-instances 0) keeps this a
          # pay-per-use accelerator, not a second always-on bill.

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} --format 'value(status.url)')
          TOKEN=$(gcloud auth print-identity-token)
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/health"
