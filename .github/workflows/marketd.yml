name: marketd (Go)

# Build + vet + test the Go market-data ingestion microservice.
on:
  push:
    paths: ["services/marketd/**", ".github/workflows/marketd.yml"]
  pull_request:
    paths: ["services/marketd/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
