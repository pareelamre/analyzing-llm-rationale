# Autonomous-twin defaults. A missing model price blocks paid research whenever
# a USD ceiling is enabled; zero-cost capacity must be declared explicitly.
research:
  model: gpt-oss-120b
  candidates_per_cycle: 3
  tool_calls_per_candidate: 8
  schema_repairs_per_candidate: 1
  usd_limit_per_account_day: "0"
  token_limit_per_account_day: 30000
  request_limit_per_account_day: 30
  model_prices_usd_per_million:
    gpt-oss-120b:
      input: null
      output: null

strategy:
  config_version: foresea-edge-shadow-v1
  mode: shadow
  live_enabled: false
  max_new_positions_per_cycle: 1
  max_open_instruments: 5
  max_research_candidates: 3
  net_edge_floor: "0.05"
  maximum_holding_seconds: 604800
  candidate_cooldown_seconds: 3600
  material_price_change: "0.01"
  cycle_bucket_seconds: 300
  intent_ttl_seconds: 60
  account_max_age_seconds: 60
  risk:
    kelly_fraction: "0.10"
    # Absolute owner limits remain zero until a later shadow or live mandate
    # explicitly allocates capital. Zero therefore produces a safe PASS.
    max_order_cash: "0"
    max_market_loss: "0"
    max_cluster_loss: "0"
    max_total_loss: "0"
    max_trailing_additions: "0"
    max_daily_realized_loss: "0"
    max_drawdown: "0.10"
