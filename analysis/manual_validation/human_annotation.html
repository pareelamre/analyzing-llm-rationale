<style>
  :root { --bg:#fff; --ink:#111; --dim:#666; --line:#e3e3e8; --paper:#f6f6f8; --acc:#0f766e; }
  * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  body { margin:0; background:var(--paper); color:var(--ink); }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; z-index:5; }
  header h1 { font-size:15px; margin:0; }
  header .sp { flex:1; }
  .bar { height:6px; background:var(--line); border-radius:999px; width:220px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--acc); width:0; }
  button { font-size:13px; padding:7px 14px; border-radius:8px; border:1px solid var(--line);
           background:#fff; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  .card.done { border-color:var(--acc); }
  .qid { font-size:11px; color:var(--dim); letter-spacing:.04em; }
  .q { font-size:17px; font-weight:600; margin:4px 0 10px; }
  .meta { font-size:12px; color:var(--dim); margin-bottom:12px; }
  .lab { font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:14px 0 6px; }
  .crit-box, .evi, .rat { font-size:14px; line-height:1.55; }
  .evi-item { border-left:3px solid var(--line); padding:4px 0 4px 12px; margin:8px 0; }
  .evi-item .src { font-weight:600; }
  .evi-item .snip { color:#333; }
  .rat { background:var(--paper); border-radius:8px; padding:12px 14px; white-space:pre-wrap; }
  .crit { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .crit:first-of-type { border-top:0; }
  .crit .info { flex:1; }
  .crit .info b { font-size:13px; }
  .crit .info span { display:block; font-size:12px; color:var(--dim); margin-top:2px; }
  .opts { display:flex; gap:6px; flex-shrink:0; }
  .opts button { min-width:64px; }
  .opts button.sel[data-v="1"] { background:#0f766e; color:#fff; border-color:#0f766e; }
  .opts button.sel[data-v="0.5"] { background:#a16207; color:#fff; border-color:#a16207; }
  .opts button.sel[data-v="0"] { background:#991b1b; color:#fff; border-color:#991b1b; }
  textarea { width:100%; margin-top:10px; border:1px solid var(--line); border-radius:8px;
             padding:8px; font-size:13px; resize:vertical; }
  .hint { font-size:12px; color:var(--dim); }
</style>

const DATA = [{"id": 39597, "question": "Will a major AI lab claim in 2025 that they have developed AGI?", "resolution_criteria": "This question will resolve as **Yes** if, during calendar year 2025, any one of the listed AI labs below or labs' leadership publicly claims to have created artificial general intelligence (AGI). * [<u>OpenAI</u>](https://www.vox.com/future-perfect/380117/openai-microsoft-sam-altman-nonprofit-for-profit-foundation-artificial-intelligence) * [<u>Anthropic</u>](https://www.vox.com/future-perfect/23794855/anthropic-ai-openai-claude-2) * Google (including [<u>DeepMind</u>](https://deepmind.google/)) * [<u>Microsoft</u>](https://www.theverge.com/24314821/microsoft-ai-ceo-mustafa-suleyman-google-deepmind-openai-inflection-agi-decoder-podcast) * [<u>Nvidia</u>](https://venturebeat.com/ai/nvidia-jus…", "predicted_answer": "Yes", "confidence": 0.85, "rationale": "The evidence from Nieman Lab suggests that a major AI lab will claim to have achieved AGI in 2025. Given the rapid advancements in AI and the high stakes involved, it is plausible that one of the listed labs will make such a claim.", "evidence": [{"source": "niemanlab.org", "title": "A tech company will claim to have achieved AGI. The news media won’t be ready. - Nieman Lab", "date": "2025-12-17", "snippet": "Jon Keegan warns that within the next year a major AI firm is likely to announce it has achieved artificial general intelligence (AGI), but journalists are unprepared for such a claim. He notes that no universally accepted, provable definition of AGI exists and that benchmark scores can be misleading, especially when companies create their own tests. Keegan advises reporters to avoid anthropomorphizing AI, to scrutinize corporate language and benchmark methodology, and to remain critical of both…"}, {"source": "observer.com", "title": "100 Leaders Shaping the Future of Artificial Intelligence - observer.com", "date": "2025-09-16", "snippet": "The Observer’s 2025 AI Power Index ranks l Work Force Cuts So Far, Agency by Agency - The New York Times", "date": "2025-03-28", "snippet": "The New York Times has documented that at least 58,566 federal employees have taken buyouts and about 76,290 more reductions are planned, affecting roughly 12% of the 2.4 million civilian workforce. Agency‑by‑agency data show the most drastic cuts at the U.S. Agency for International Development and the U.S. Agency for Global Media, each with over 99% reductions, while the Department of Defense plans up to 39,000 additional cuts. Reductions have been driven by an executive order establishing a D…"}, {"source": "federalnewsnetwork.com", "title": "Weekend news dump: GSA, SBA, IRS initiate new workforce cuts - Federal News Network", "date": "2025-03-31", "snippet": "The General Services Administration announced a May deadline for additional staff reductions using layoffs and incentive programs. The article notes that the Small Business Administration and the Internal Revenue Service have also begun new workforce‑cut initiatives. No further details about the scope or timing of the SBA and IRS actions are provided."}, {"source": "npr.org", "title": "Entire staff at federal agency that funds libraries and museums put on leave - NPR", "date": "2025-03-31", "snippet": "The Institute of Museum and Library Services (IMLS), a small federal agency that distributes roughly $266 million in grants to libraries and museums, placed its entire staff of about 70 employees on paid administrative leave for up to 90 days after a meeting between agency leadership and Department of Governmental Efficiency (DOGE) staff. The leave followed President Trump's appointment of Keith E. Sonderling as acting director and an executive order that shrank seven federal agencies, including…"}]}, {"id": 37643, "question": "Will the Project 2025 Tracker spreadsheet have the objective of terminating the Public Service Loan Forgiveness program marked as complete before July 1, 2025?", "resolution_criteria": " within the specified timeframe.", "evidence": [{"source": "nytimes.com", "title": "Tracking Post-Tropical Cyclone Erin - The New York Times", "date": "2025-10-07", "snippet": "Erin was declared a post‑tropical cyclone in the North Atlantic on Friday afternoon Eastern time, according to the National Hurricane Center. It is the fifth named storm of the 2025 Atlantic season, which NOAA had earlier projected to produce 13‑19 named storms, later revised to 18, with up to nine potentially becoming hurricanes. The 2025 season has had a slow start compared with the previous year, which saw 18 named storms, 11 hurricanes and two Category 5 storms, while ocean heat content in t…"}, {"source": "watchers.news", "title": "Subtropical Storm Karen forms in North Atlantic - The Watchers - Watching the world evolve and transform", "date": "2025-10-10", "snippet": "Subtropical Storm Karen formed in the far North Atlantic on October 10, 2025, and was named by the National Hurricane Center at 03:00 UTC as the season's 11th named storm. By 09:00 UTC the storm was located about 915 km north‑northwest of the Azores, with maximum sustained winds of 75 km/h, gusts higher, a minimum central pressure of 998 hPa, and a northeast motion of 15 km/h. The National Hurricane Center expects little change in intensity over the next day, followed by gradual acceleration nor…"}, {"source": "eu.usatoday.com", "title": "Hurricane watchers eye tropical wave in Atlantic Ocean. See where it's heading - USA Today", "date": "2025-10-06", "snippet": "The National Hurricane Center identified a broad low‑pressure area in the Atlantic, designated Invest 95L, with a 50% chance of developing into a tropical cyclone within 48 hours and a 70% chance within seven days, and it is expected to approach the Leeward Islands later this week, potentially receiving the name Jerry if it becomes a named storm. A separate weak low‑pressure system over the north‑central Gulf of Mexico is producing showers along the Louisiana, Mississippi, and Alabama coasts but…"}]}, {"id": 37097, "question": "Will there be a successful coup in Africa or Latin America before July 1, 2025?", "resolution_criteria": "This question resolves as **Yes** if there is a successful coup d’état in any country on the African continent or Latin America before July 1, 2025, according to credible media reports. If this does not occur, this question resolves as **No**.", "predicted_answer": "No", "confidence": 0.95, "rationale": "The evidence provided describes a symbolic reburial of former Liberian President William Tolbert, which occurred after the resolution date of July 1, 2025. No successful coup was reported in Africa or Latin America before this date.", "evidence": [{"source": "bbc.com", "title": "William Tolbert: Liberian president killed in coup to get state funeral after 45 years - BBC", "date": "2025-07-01", "snippet": "Former Liberian President William Tolbert, murdered in the 1980 coup that brought Samuel Doe to power, received a symbolic state funeral 45 years later, with an empty grave left unsealed in case remains are found. The ceremony, attended by President Joseph Boakai and other dignitaries, was presented as an act of national conscience, reconciliation, and a step toward acknowledging historical wrongs. Families of the 14 executed officials, whose bodies have never been recovered, received Liberian f…"}]}, {"id": 19493, "question": "Will Labor win the seat of Sturt in the next Australian Federal Election?", "resolution_criteria": "This question will resolve as **Yes** if the [Australian Electoral Commission](https://www.aec.gov.au/) declares the result of this seat for the ALP candidate in the next Australian Federal Election. The question will resolve in the negative if any other party wins the seat, or other factors mean that nobody wins the seat.", "predicted_answer": "Yes", "confidence": 0.95, "rationale": "The evidence from the ABC news article confirms that Labor candidate Claire Clutterham won the seat of Sturt, ending the Liberal Party's 53-year hold on the seat. Given the extremely close margin and the confirmation from the Liberal incumbent, this outcome is highly certain.", "evidence": [{"source": "abc.net.au", "title": "Senior Liberal slams 'diabolical result' as Labor wins SA marginal seats - Australian Broadcasting Corporation", "date": "2025-05-03", "snippet": "In the 2025 Australian federal election, Labor captured the South Australian marginal seats of Sturt and Boothby, ending a 53‑year Liberal hold on Sturt and retaining Boothby with a significant swing. Liberal incumbent James Stevens conceded Sturt to Labor candidate Claire Clutterham, while former Liberal MP Nicolle Flint lost Boothby to incumbent Labor MP Louise Miller‑Frost. Former Liberal senator Simon Birmingham described the outcomes as \"diabolical\" and \"rock bottom\" for the party, urging a…"}, {"source": "9news.com.au", "title": "The federal election seats where just a few hundred votes could make all the difference - 9News.com.au", "date": "2025-05-03", "snippet": "The Australian Electoral Commission has identified 51 federal electorates as marginal, with ten seats having margins under 1 per cent that could decide the 2025 election outcome. The closest seat is Deakin in Victoria, held by Liberal Michael Sukkar with a 0.02 per cent margin after redistribution, followed by Bennelong in New South Wales, now notionally Liberal at a 0.04 per cent margin despite Labor incumbent Jerome Laxale's 2022 win. Other ultra‑tight contests include Gilmore (0.17 per cent),…"}, {"source": "news.com.au", "title": "Fresh blow to Dutton in latest poll - News.com.au", "date": "2025-05-03", "snippet": "The page detected the visitor as a potential crawler bot and displayed a warning. It advises disabling ad‑blockers, pop‑up blockers, and script blockers, and ensuring JavaScript is enabled and the browser is up to date. The message also provides the visitor's IP address and a reference number for further 0101 of the \"One, Big, Beautiful Bill\"</u>](https://waysandmeans.house.gov/wp-content/uploads/2025/05/The-One-Big-Beautiful-Bill-Section-by-Section.pd…", "predicted_answer": "Yes", "confidence": 0.95, "rationale": "The evidence from multiple sources, including the Tax Policy Center, Dykema, and CNBC, indicates that the 2025 reconciliation bill includes a provision allowing for an above-the-line deduction for qualified tips received by individuals in tipped occupations. This provision is set to apply to tax year 2026.", "evidence": [{"source": "taxpolicycenter.org", "title": "2025 Tax Cuts Tracker - Tax Policy Center", "date": "2025-07-04", "snippet": "In July 2025, Congress passed and President Trump signed a budget reconciliation package that extended many expiring provisions of the 2017 Tax Cuts and Jobs Act (TCJA) and restored business tax breaks slated to phase out. The package also includes campaign proposals to exempt tips, overtime pay, and Social Security benefits from federal income tax, as well as an auto‑loan interest deduction. It addresses the impending expiration of TCJA elements such as lower individual rates, a larger standard…"}, {"source": "dykema.com", "title": "Landmark Tax Legislation of the One Big Beautiful Bill Act: What It Means for You - Dykema", "date": "2025-07-07", "snippet": "On July 4, 2025 President Trump signed the One Big Beautiful Bill Act, which makes many provisions of the 2017 Tax Cuts and Jobs Act permanent and adds new tax relief measures. The Act permanently extends reduced individual income tax rates, the near‑doubling of the standard deduction, the child tax credit, and the pass‑through business deduction, while also making the estate and gift tax exemption of $15 million (indexed) permanent. New middle‑class benefits include above‑the‑line deductions fo…"}, {"source": "cnbc.com", "title": "What the Senate Republican tax-and-spending bill means for your money - CNBC", "date": "2025-07-03", "snippet": "Senate Republicans approved a version of President Trump’s multitrillion‑dollar tax‑and‑spending bill that would make the 2017 tax cuts permanent and add new deductions for tip income, overtime pay, and auto‑loan interest. The legislation raises the state and local tax (SALT) deduction cap to $40,000 in 2025, increases the child tax credit to $2,200, and expands a senior tax‑deduction bonus to $6,000, while preserving a SALT workaround for pass‑through businesses. It also proposes major spending…"}]}, {"id": 29290, "question": "Will Boeing file for bankruptcy before January 1, 2026?", "resolution_criteria": "This question will resolve as **Yes** if, before January 1, 2026, Boeing files for Chapter 7 or Chapter 11 bankruptcy, or otherwise makes a formal legal filing to initiate liquidation proceedings.", "predicted_answer": "Yes", "confidence": 0.75, "rationale": "Boeing has faced numerous financial and operational challenges, including the 737 MAX crisis, supply chain disruptions, and ongoing labor strikes. Given the company's continued financial struggles and the resolution criteria, it is plausible that Boeing may file for bankruptcy before January 1, 2026.", "evidence": [{"source": "wenatcheeworld.com", "title": "These new laws and taxes took effect in Washington state on Jan. 1 - The Wenatchee World", "date": "2026-01-03", "snippet": "No article content was provided, so a summary cannot be generated."}]}, {"id": 39782, "question": "Will Beyond Meat file for bankruptcy before November 1, 2025?", "resolution_criteria": "This question resolves as **Yes** if Beyond Meat, Inc., files any petition for bankruptcy protection in the United States, under any chapter of the United States Bankruptcy Code, before November 1, 2025. The question will resolves on the filing of such a petition, not on whether any bankruptcy protection is granted by a court. If no such petition is filed before that date, this question resolves as **No**.", "predicted_answer": "No", "confidence": 0.85, "rationale": "Despite Beyond Meat's financial struggles, including declining sales and a debt load, the company has consistently denied filing for bankruptcy and has taken steps to restructure and improve its financial situation. Additionally, the company has sufficient liquidity to operate through 2027, reducing the immediate likelihood of a bankruptcy filing.", "evidence": [{"source": "greenqueen.com.hk", "title": "No, Beyond Meat Has Not Filed for Bankruptcy - Green Queen Media", "date": "2025-08-15", "snippet": "Beyond Meat has denied media reports that it filed for Chapter 11 bankruptcy, stating the claims are unequivocally false. The company continues to face declining sales, with Q2 2025 revenue down 20% year‑on‑year and a 15% drop in the first half of the year compared to 2024, prompting layoffs and the hiring of restructuring expert John Boken as interim chief transformation officer. Beyond Meat holds $1.1 billion in convertible note debt due in 2027 and has secured a $100 million financing facilit…"}, {"source": "foodinstitute.com", "title": "Beyond Meat on the Verge of Financial Ruin - The Food Institute", "date": "2025-08-21", "snippet": "Beyond Meat has denied plans to file for bankruptcy but is facing significant financial strain, including a 20% revenue decline in Q2 2025 and a debt load of about $1.2 billion. Creditsafe data shows the company's Days Beyond Terms more than doubled over the past year, reaching 20 in May 2025, and the proportion of overdue invoices rose sharply, indicating liquidity pressures. The firm reported an operating loss of 45 cents per dollar of sales in 2024 and is exploring restructuring options while…"}, {"source": "latimes.com", "title": "Beyond Meat's stock collapses after debt deal - Los Angeles Times - Los Angeles Times", "date": "2025-10-16", "snippet": "Beyond Meat's shares fell below $1 after the company completed a debt‑reduction deal that will issue up to 326 million new shares to note holders, diluting existing equity. Sales hav rcent after Beijing’s retaliation, leaving many U.S. importers exposed. Economists noted that while the market rally eased recession fears, bond yields rose, oil prices fell, and the European Union moved to impose counter‑tariffs on U.S. goods. The White House framed the pa…"}, {"source": "nytimes.com", "title": "Uncertainty Over Tariffs Leads to Wild Swings in Markets - The New York Times", "date": "2025-04-07", "snippet": "President Trump’s renewed threat of steep tariffs on China, including a possible 50% levy, sent the S&P 500 into bear‑market territory before it closed only slightly down, reflecting wild intraday swings. False reports of a tariff reprieve briefly lifted stocks, but the president’s insistence on maintaining the trade war revived fears of a global economic slowdown, prompting sharp declines in Asian and European markets and a drop in commodities such as oil and copper. Walmart’s executives highli…"}, {"source": "nytimes.com", "title": "Trump Administration Highlights: President Signs Order Aimed at Closing Education Dept. - The New York Times", "date": "2025-05-31", "snippet": "President Trump signed an executive order stating his intent to eliminate the federal Department of Education, though the agency can only be closed with congressional approval and some core functions such as student loans and special‑education funding are expected to remain. The order was announced alongside other administration actions, including a freeze on $500 million in food‑assistance shipments from the USDA’s Commodity Credit Corporation, leaving food banks nationwide scrambling to replac…"}]}, {"id": 39694, "question": "Will the interest in \"directv\" be greater on 2025-09-09 than on 2025-09-02 according to Google Trends?", "resolution_criteria": "This question resolves \"Yes\" if, on the Google Trends \"interest over time chart [here](https://trends.google.com/trends/explore?geo=US&tz=0&q=directv&date=2025-08-10%202025-09-09), the day-aggregated value for 2025-09 ent is scheduled for September. It continues a series that brings notable songwriters together for a collaborative workshop. The announcement was published on June 18, 2025."}]}, {"id": 6948, "question": "Will lepton universality be falsified before 2026?", "resolution_criteria": "This question resolves positively if a peer reviewed paper is published before 2025/12/31 claiming to have found evidence at the \\(5\\sigma\\) level or greater that lepton universality is violated in nature", "predicted_answer": "No", "confidence": 0.85, "rationale": "The evidence summaries do not contain any peer-reviewed papers claiming evidence at the 5σ level or greater that lepton universality is violated. The latest relevant publication is from December 2025, which does not meet the criteria for resolving the question positively.", "evidence": [{"source": "arxiv.org", "title": "Estimation of backgrounds from jets misidentified as $τ$-leptons using the Universal Fake Factor method with the ATLAS detector", "date": "2025-02-06", "snippet": "The ATLAS Collaboration introduced the Universal Fake Factor method to estimate backgrounds from jets that are misidentified as hadronically decaying τ‑leptons. The technique combines fake factors measured in data samples enriched in light‑quark, gluon, b‑quark, and pile‑up jets to predict the background in a signal region. For the full Run 2 dataset, systematic uncertainties on the derived fake factors, evaluated using a W(μν)‑enriched sample, vary between 15 % and 35 % depending on the τ‑lepto…"}, {"source": "repository.cern", "title": "Test of lepton universality using B⁺→K⁺ℓ⁺ℓ⁻ decays", "date": "2023-08-21", "snippet": "The dissertation presents the first CMS measurement of the lepton‑universality ratio $R_{K}=\\mathcal{B}(B^{+}\\to K^{+}\\mu^{+}\\mu^{-})/\\mathcal{B}(B^{+}\\to K^{+}e^{+}e^{-})$, using the B‑parking data set that contains about $10^{10}$ $B$ hadron decays collected in 2018. A novel low‑$p_T$ electron reconstruction algorithm and dedicated electron identification are introduced to improve efficiency for soft electrons. Event selection is enhanced with a machine‑learning classifier that suppresses the…"}, {"source": "epjc.epj.org", "title": "Estimation of backgrounds from jets misidentified as -leptons using the Universal Fake Factor method with the ATLAS detector", "date": "2025-12-01", "snippet": "The ATLAS experiment uses the Universal Fake Factor method to estimate backgrounds from jets that are misidentified as hadronically decaying tau leptons in proton‑proton collisions at the LHC. The technique measures fake factors in data‑driven control regions enriched in light‑quark, gluon, b‑quark, and pile‑up jets, then combines them linearly to predict the background in the signal region. For the full Run 2 dataset, the systematic uncertainty on these fake factors varies between 15 % and 35 %…"}]}, {"id": 35176, "question": "Will Dune: Part Two win an Oscar in 2025?", "resolution_criteria": "This question resolves as **Yes** if Dune: Part Two wins an Oscar at the 97 Academy Awards. Resolves according to the credible sources or [the Oscars website](https://www.oscars.org/oscars/ceremonies/2025) when accessed by Metaculus.", "predicted_answer": "No", "confidence": 0.95, "rationale": "Dune: Part Two won Oscars for Best Sound and Best Visual Effects, but did not win the Best Picture award, which is required to meet the resolution criteria.", "evidence": [{"source": "6abc.com", "title": "'Dune: Part Two' wins Oscar for Best Sound - 6abc Philadelphia", "date": "2025-03-02", "snippet": "Basel Adra, Rachel Szor, Hamdan Ballal and Yuval Abraham received the Oscar for Best Documentary Feature Film for \"No Other Land\" at the 2025 Academy Awards. The film documents the experiences of the West Bank community of Masafer Yatta, highlighting daily threats of settler violence, home demolitions, and forced displacement. It also portrays an unlikely partnership between Palestinian activist Adra and Israeli jo une", "date": "2025-03-27", "snippet": "The Indus River System Authority (IRSA) projected a 43% water shortage for April 2025 after recording below‑normal inflows caused by 31% less snowfall in the Indus and Jhelum catchments. The IRSA Advisory Committee approved water availability only for April, with a review scheduled for the first week of May. The Pakistan Meteorological Department warned of below‑normal rainfall and above‑normal temperatures for April to June, noting that winter rainfall was 42% below normal across the country. O…"}]}, {"id": 39377, "question": "Will French president Emmanuel Macron call another snap legislative election before 2026?", "resolution_criteria": "Will resolve YES if French President Emmanuel Macron has called a snap election (early legislative election or dissolution of the National Assembly) before January 1, 2026. Will resolve NO if this does not happen before then.", "predicted_answer": "Yes", "confidence": 0.85, "rationale": "The French government faced significant challenges in passing the 2026 budget, leading to the suspension of parliamentary discussions and the consideration of invoking Article 49.3, which could trigger a no-confidence vote. Given the political instability and Macron's history of considering snap elections in similar situations, it is highly likely that he will call another snap legislative election before 2026.", "evidence": [{"source": "france24.com", "title": "French PM Lecornu under pressure to force through budget, risking no-confidence vote - France 24", "date": "2026-01-16", "snippet": "French Prime Minister Sébastien Lecornu is confronting a parliamentary deadlock over the 2026 budget and is considering using Article 49.3 or a decree to adopt the bill without a vote, both of which could trigger a no‑confidence motion that might topple his government. His predecessors were removed in similar circumstances, and the centre‑right administration has said a vote on the budget is impossible before Tuesday. e Conservatives lost all 15 councils they were defending. This indicates a significant decline in Conservative support in the area.", "evidence": [{"source": "theweek.com", "title": "Local elections 2025: where are they and who is expected to win? - The Week", "date": "2025-04-29", "snippet": "The 1 May 2025 local elections in England will see 23 councils and more than 1,600 councillor seats contested, alongside six mayoral races in regions such as the West of England and Greater Lincolnshire. Voters must be British, qualifying Commonwealth, or EU citizens and present photo ID, with a deadline for a free Voter Authority Certificate having already passed. Polls indicate Reform UK leading nationally at 25%, ahead of Labour (23%) and the Conservatives (21%), and analysts predict the part…"}, {"source": "bbc.com", "title": "Local elections 2025 in maps and charts - BBC", "date": "2025-05-03", "snippet": "In England's 1 May 2025 local elections, Reform UK achieved a breakthrough, winning control of ten councils and securing 31% of the vote, including victories in former Conservative strongholds such as Derbyshire, Kent and Lancashire. Both Labour and the Conservatives suffered historic defeats, losing two‑thirds of their council seats and, for the Conservatives, all sixteen councils they previously controlled. The Liberal Democrats gained control of three councils—Cambridgeshire, Oxfordshire and…"}, {"source": "theguardian.com", "title": "Farage claims Reform UK local election gains ‘beginning of the end’ for Tories - The Guardian", "date": "2025-05-02", "snippet": "Nigel Farage said Reform UK’s strong performance in England’s local elections marks the “beginning of the end” for the Conservative Party, claiming his party has become the main opposition. Reform UK won the Runcorn and Helsby parliamentary by‑election by six votes, secured mayoralties in Greater Lincolnshire, Hull and East Yorkshire, and took control of ten councils, gaining 648 seats while the Tories lost a to meet in Saudi Arabia 'next week,' and Zelenskyy has expressed readiness to work with Trump. Given the timeframe and the conditions outlined, it is likely that a meeting will occur before April 7, 2025.", "evidence": [{"source": "aljazeera.com", "title": "Trump threatens Russia with sanctions, tariffs amid his spat with Ukraine - Al Jazeera", "date": "2025-03-07", "snippet": "U.S. President Donald Trump posted on Truth Social that he is considering large‑scale banking sanctions, sanctions, and tariffs against Russia until a cease‑fire and final peace settlement are reached, citing Russia’s recent missile bombardment of Ukrainian energy facilities. He framed himself as a peacemaker, urging both Russia and Ukraine to negotiate, while criticizing Ukrainian President Volodymyr Zelenskyy and claiming negotiations with Russia are easier than with Ukraine. The statement fol…"}, {"source": "theguardian.com", "title": "Trump says Putin launching massive strike on Ukraine is ‘what anybody would do’ - The Guardian", "date": "2025-03-08", "snippet": "President Donald Trump told reporters that Vladimir Putin’s large‑scale missile and drone strike on Ukraine was \"what anybody would do\" and that it might be easier for the United States to negotiate a settlement with Russia than with Ukraine. The comments came after the U.S. halted intelligence sharing and military aid to Kyiv, a move that preceded Russia’s attack on Ukrainian energy facilities. Trump said he was considering broad banking sanctions and tariffs on Russia to force a cease‑fire, wh…"}, {"source": "npr.org", "title": "The short history of Trump’s tariff chaos — and more that happened this week - NPR", "date": "2025-03-07", "snippet": "The article chronicles President Trump's erratic rollout of tariffs on Mexico, Canada, and China during his first six weeks in office, noting multiple delays, reversals, and retaliatory measures that have left businesses and consumers uncertain about pricing. It details a day‑by‑day timeline of executive orders, tariff announcements, and subsequent postponements, including a final decision to delay auto‑related tariffs until April 2 and a brief implementation of 25% tariffs on Mexican and Canadi…"}]}, {"id": 37009, "question": "Will Haley Stevens announce her candidacy for US Senator from Michigan before May 1, 2025?", "resolution_criteria": "This question resolves as **Yes** if Haley Stevens announces her candidacy for US Senator from Michigan before May 1, 2025. If no such announcement has been made before that date, the question resolves as **No**.", "predicted_answer": "Yes", "confidence": 0.95, "rationale": "Multiple news articles confirm that Haley Stevens officially announced her candidacy for the U.S. Senate from Michigan on April 22, 2025, well before the May 1, 2025, deadline.", "evidence": [{"source": "michiganadvance.com", "title": "Haley Stevens announces run for US Senate, becoming the 3rd Democrat seeking to replace Gary Peters - Michigan Advance", "date": "2025-04-22", "snippet": "U.S. Rep. Haley Stevens announced her candidacy for Michigan’s open U.S. Senate seat, becoming the third Democrat to enter the race to succeed retiring Sen. Gary Peters. Stevens framed her campaign as a response to what she called the \"Trump‑Musk chaos agenda,\" citing concerns about Social Security and rising costs, and highlighted her experience in the Obama‑era auto bailout and the passage of the Chips and Science Act. She noted her fundraising strength, including a $1.1 million haul in the fi…"}, {"source": "politico.com", "title": "Haley Stevens launches Senate bid in Michigan - Politico", "date": "2025-04-22", "snippet": "Rep. Haley Stevens announced her candidacy for the U.S. Senate seat from Michigan, aiming to succeed retiring Democrat Gary Peters. In her video launch, she highlighted her experience on President Obama’s auto rescue task force and framed her campaign around economic issues such as rising prices and housing costs. Stevens will join a crowded Democratic primary that includes state Sen. Mallory McMorrow, former health department director Abdul El‑Sayed, and likely former House Speaker Joe Tate, wh…"}, {"source": "bridgemi.com", "title": "Haley Stevens runs for US Senate, vowing to fight ‘Trump-Musk chaos agenda’ - Bridge Michigan", "date": "2025-04-22", "snippet": "Haley Stevens has entered the race for the United States Senate. In her campaign announcement, she pledged to combat what she describes as the \"Trump-Musk chaos agenda.\" The statement signals her intent to position herself against the policies and influence associated with former President Donald Trump and entrepreneur Elon Musk. The article reports on her candidacy and the central theme of her platform."}]}, {"id": 37436, "question": "Will 300 or more UN staff be reported to be killed in Gaza according to UN's OCHA in its final impact snapshot before July 1, 2025?", "resolution_criteria": "This question resolves as **Yes** if the number of reported UN staff killed in Gaza is greater than or equal to 300 according to the most recent impact snapshot for the Gaza Strip posted [here](https://www.ochaopt.org/publications) by the United Nations Office for the Coordination of Humanitarian Affairs as of July 1, 2025. For example, a snapshot dated April 30, 2025, [reports](https://www.ochaopt.org/content/reported-impact-snapshot-gaza-strip-30-april-2025) 295 UN staff fatalities.", "predicted_answer": "No", "confidence": 0.95, "rationale": "The latest evidence provided is a security verification notice from the UNRWA website, which does not contain any information about UN staff fatalities in Gaza. Given the lack of relevant data and the time proximity to the resolution date, it is unlikely that the number of reported UN staff killed will reach 300 by July 1, 2025.", "evidence": [{"source": "unrwa.org", "title": "UNRWA Situation Report #171 on the Humanitarian Crisis in the Gaza Strip and the West Bank, including East Jerusalem - UNRWA", "date": "2025-05-16", "snippet": "The provided excerpt contains only a security verification notice from the UNRWA website and does not include any of the report’s substantive content, so a factual summary of the article cannot be generated from the available text."}]}, {"id": 35733, "question": "Will there be a new world record in the 2025 World Figure Skating Championships?", "resolution_criteria": "This question will resolve as **Yes** if in the 2025 World Figure Skating Championships, there is a new world record in any category (men's singles, women's singles, pairs, ice dance), for any segment, on any of the possible scores: * TES – Technical element score * PCS – Program component score * TSS – Total segment score * Combine Total TSS across segments.", "predicted_answer": "Yes", "confidence": 0.75, "rationale": "Ilia Malinin, the reigning men's singles champion, is attempting to land seven quadruple jumps in his program, which would likely break the current world record for most quads landed in a single routine. Given his track record and the high level of competition, there is a strong possibility of a new world record being set.", "evidence": [{"source": "nbcnews.com", "title": "Who to watch on the U.S. team in the World Figure Skating Championships - NBC News", "date": "2025-03-25", "snippet": "The 2025 World Figure Skating Championships in Boston, the first U.S. host since 2016, serve as a key qualifier for the 2026 Milan-Cortina Olympic teams. American skaters entering as reigning world champions include men’s singles champion Ilia Malinin, ice‑dance duo Madison Chock and Evan Bates, and women’s singles leader Amber Glenn, who has won every international start this season. Malinin, nicknamed “Quadgod,” aims to attempt seven quadruple jumps despite the risk, while Glenn seeks to capit…"}, {"source": "hollywoodreporter.com", "title": "How to Watch the 2025 World Figure Skating Championships Online - The Hollywood Reporter", "date": "2025-03-24", "snippet": const CRITERIA = [{"key": "criterion_alignment", "label": "Criterion alignment", "desc": "Does the rationale address the question's actual resolution criteria (the specific event/threshold/date), rather than a vaguely related topic?"}, {"key": "evidence_consistency", "label": "Evidence consistency", "desc": "Are the rationale's factual claims consistent with the provided evidence (no contradiction of what the sources say)?"}, {"key": "hallucination", "label": "Free of hallucination", "desc": "Does the rationale avoid asserting facts, numbers, or events that are NOT in the provided evidence? Yes = clean, No = it invents unsupported facts."}, {"key": "usefulness", "label": "Usefulness", "desc": "Would this rationale genuinely help a human forecaster understand and sanity-check the forecast?"}, {"key": "probability_support", "label": "Supports the probability", "desc": "Does the rationale justify the *specific* probability shown (e.g. 85% vs 60%), not merely the direction (Yes/No)?"}];
const LSKEY = "human_annot_v1";
let store = JSON.parse(localStorage.getItem(LSKEY) || "{}");

function save() { localStorage.setItem(LSKEY, JSON.stringify(store)); refreshProgress(); }
function rec(id) { return (store[id] = store[id] || {}); }
function esc(s) { const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

function setVal(id, key, v, btn) {
  rec(id)[key] = v;
  const group = btn.parentElement;
  [...group.children].forEach(b => b.classList.toggle("sel", b === btn));
  const card = document.getElementById("card-" + id);
  card.classList.toggle("done", CRITERIA.every(c => rec(id)[c.key] !== undefined));
  save();
}
function setNote(id, v) { rec(id).notes = v; save(); }

function refreshProgress() {
  const done = DATA.filter(it => CRITERIA.every(c => (store[it.id]||{})[c.key] !== undefined)).length;
  document.getElementById("count").textContent = done + " / " + DATA.length;
  document.getElementById("prog").style.width = (100 * done / DATA.length) + "%";
}

function render() {
  const root = document.getElementById("cards");
  root.innerHTML = DATA.map((it, i) => {
    const conf = it.confidence == null ? "—" : Math.round(it.confidence * 100) + "%";
    const evi = (it.evidence || []).map(e =>
      `<div class="evi-item"><div class="src">${esc(e.source)}${e.date ? " · " + esc(e.date) : ""}</div>`
      + (e.title ? `<div>${esc(e.title)}</div>` : "")
      + (e.snippet ? `<div class="snip">${esc(e.snippet)}</div>` : "") + `</div>`).join("") || `<div class="hint">No evidence recorded for this item.</div>`;
    const crit = CRITERIA.map(c => {
      const cur = (store[it.id]||{})[c.key];
      const opt = v => `<button data-v="${v}" class="${cur===v?'sel':''}" onclick="setVal(${it.id},'${c.key}',${v},this)">${v===1?'Yes':v===0.5?'Partial':'No'}</button>`;
      return `<div class="crit"><div class="info"><b>${esc(c.label)}</b><span>${esc(c.desc)}</span></div>`
        + `<div class="opts">${opt(1)}${opt(0.5)}${opt(0)}</div></div>`;
    }).join("");
    return `<div class="card ${CRITERIA.every(c=>(store[it.id]||{})[c.key]!==undefined)?'done':''}" id="card-${it.id}">
      <div class="qid">#${i+1} · id ${it.id}</div>
      <div class="q">${esc(it.question)}</div>
      <div class="meta">Model answer: <b>${esc(it.predicted_answer)}</b> · probability <b>${conf}</b></div>
      <div class="lab">Resolution criteria</div><div class="crit-box">${esc(it.resolution_criteria) || '<span class="hint">n/a</span>'}</div>
      <div class="lab">Evidence the model saw</div><div class="evi">${evi}</div>
      <div class="lab">Rationale to score</div><div class="rat">${esc(it.rationale)}</div>
      <div class="lab">Your ratings</div>${crit}
      <textarea rows="2" placeholder="Notes (optional)" oninput="setNote(${it.id}, this.value)">${esc((store[it.id]||{}).notes||"")}</textarea>
    </div>`;
  }).join("");
}

function downloadCsv() {
  const cols = ["id", ...CRITERIA.map(c => c.key), "annotator", "notes"];
  const who = document.getElementById("annotator").value || "";
  const esc = s => { s = s==null?"":String(s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const rows = [cols.join(",")];
  for (const it of DATA) {
    const r = store[it.id] || {};
    rows.push([it.id, ...CRITERIA.map(c => r[c.key] ?? ""), who, r.notes ?? ""].map(esc).join(","));
  }
  const blob = new Blob([rows.join("\n") + "\n"], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "human_annotations.csv"; a.click();
}
function resetAll() { if (confirm("Clear all your ratings?")) { store = {}; save(); render(); } }

render(); refreshProgress();
</script>
</body>
</html>
