# Smithery.ai MCP Server Configuration
# https://smithery.ai/docs/config

name: "foresea"
displayName: "Foresea — Calibrated Forecasting & Prediction Markets Oracle"
description: "Equip AI agents (Claude, Cursor, Codex, Antigravity) with calibrated probability forecasting, real-time prediction market odds (Polymarket & Kalshi), live orderbook depth, model-vs-market edge detection, adversarial debate, and Fractional Kelly capital sizing."
tags:
  - forecasting
  - prediction-markets
  - polymarket
  - kalshi
  - finance
  - trading
  - probability
  - research
  - quant
  - analytics

startCommand:
  type: stdio
  config:
    command: foresea-mcp
    args: []
    env:
      FORESEA_BASE_URL: "https://foresea.ink"
      FORESEA_API_KEY: ""
