[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyzing-llm-rationale"
version = "0.1.0"
description = "Batch inference tooling for forecasting rationale experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Pareel Amre" },
]
dependencies = [
  "huggingface_hub>=0.30.0",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "torch>=2.2.0",
  "transformers>=4.49.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
]
analysis = [
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pypdf>=5.0.0",
  "scikit-learn>=1.4.0",
  "shap>=0.46.0",
]
serve = [
  "cryptography>=42",
  "duckdb>=1.0",
  "email-validator>=2.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "google-auth>=2.0",
  "google-cloud-datastore>=2.19",
  "google-cloud-storage>=2.16",
  "PyJWT>=2.8",
  "python-multipart>=0.0.13",
  "pypdf>=5.0.0",
  "beautifulsoup4>=4.12",
  "redis>=5.0",
  "httpx>=0.28",
  "mcp>=1.27.1,<2",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-logging>=0.46b0",
  "opentelemetry-instrumentation-requests>=0.46b0",
]
tracking = [
  "mlflow>=2.13",
]
pipeline = [
  "ddgs>=9.0",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-community>=0.3",
  "feedparser>=6.0",
  "gnews>=0.5",
  "sentence-transformers>=3.0",
  "trafilatura>=2.0",
  "duckdb>=1.0",
  "prefect>=3.0",
]
mcp = [
  "httpx>=0.28",
  "mcp>=1.27.1,<2",
]
trading = [
  "cryptography>=42",
  "py-clob-client-v2>=1.0.1",
]

[project.scripts]
analyze-llm-rationale = "analyzing_llm_rationale.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B905 (zip-without-explicit-strict) requires the `strict=` kwarg, which is
# Python 3.10+. We also run/test on 3.9, so don't force it.
ignore = ["E501", "B905"]
