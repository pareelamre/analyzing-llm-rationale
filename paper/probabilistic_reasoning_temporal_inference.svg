<text x="215.0" y="223.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="215.0" dy="0.0" font-size="15" font-weight="400">Prior belief</tspan><tspan x="215.0" dy="18.8" font-size="15" font-weight="700">P(H) or P(X₀)</tspan><tspan x="215.0" dy="18.8" font-size="12" font-weight="400">background knowledge before</tspan><tspan x="215.0" dy="15.0" font-size="12" font-weight="400">new data</tspan></text>
<text x="215.0" y="394.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="215.0" dy="0.0" font-size="15" font-weight="400">Evidence /</tspan><tspan x="215.0" dy="18.8" font-size="15" font-weight="400">observations</tspan><tspan x="215.0" dy="18.8" font-size="15" font-weight="700">E₁:ₜ</tspan><tspan x="215.0" dy="18.8" font-size="12" font-weight="400">new contextual and temporal</tspan><tspan x="215.0" dy="15.0" font-size="12" font-weight="400">data</tspan></text>
<text x="525.0" y="321.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="525.0" dy="0.0" font-size="15" font-weight="400">Bayesian update</tspan><tspan x="525.0" dy="18.8" font-size="15" font-weight="700">P(H|E) = P(E|H)P(H) / P(E)</tspan><tspan x="525.0" dy="18.8" font-size="12" font-weight="400">likelihood weights hypotheses by</tspan><tspan x="525.0" dy="15.0" font-size="12" font-weight="400">fit to evidence</tspan></text>
<text x="845.0" y="321.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="845.0" dy="0.0" font-size="15" font-weight="400">Posterior belief state</tspan><tspan x="845.0" dy="18.8" font-size="15" font-weight="700">P(Xₜ | E₁:ₜ)</tspan><tspan x="845.0" dy="18.8" font-size="12" font-weight="400">current uncertainty after all</tspan><tspan x="845.0" dy="15.0" font-size="12" font-weight="400">evidence so far</tspan></text>
<text x="1155.0" y="321.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="1155.0" dy="0.0" font-size="15" font-weight="400">Forecast / prediction</tspan><tspan x="1155.0" dy="18.8" font-size="15" font-weight="700">P(Xₜ₊ₖ | E₁:ₜ)</tspan><tspan x="1155.0" dy="18.8" font-size="12" font-weight="400">future event probability with</tspan><tspan x="1155.0" dy="15.0" font-size="12" font-weight="400">calibrated uncertainty</tspan></text>

<text x="405.0" y="525.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#0F766E" text-anchor="start"><tspan x="405.0" dy="0.0" font-size="17" font-weight="700">Temporal inference: probabilistic reasoning over time-indexed states</tspan><tspan x="405.0" dy="21.2" font-size="17" font-weight="700">and observations</tspan></text>
<text x="505.0" y="626.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="505.0" dy="0.0" font-size="14" font-weight="700">State at t-1</tspan><tspan x="505.0" dy="17.5" font-size="14" font-weight="400">P(Xₜ-₁ | E₁:ₜ-₁)</tspan></text>
<text x="740.0" y="619.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="740.0" dy="0.0" font-size="14" font-weight="400">Transition model</tspan><tspan x="740.0" dy="17.5" font-size="14" font-weight="700">P(Xₜ | Xₜ-₁)</tspan><tspan x="740.0" dy="17.5" font-size="12" font-weight="400">time dynamics</tspan></text>
<text x="975.0" y="626.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="975.0" dy="0.0" font-size="14" font-weight="700">State at t</tspan><tspan x="975.0" dy="17.5" font-size="14" font-weight="400">P(Xₜ | E₁:ₜ)</tspan></text>
<text x="975.0" y="710.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="975.0" dy="0.0" font-size="14" font-weight="700">Observation at t</tspan><tspan x="975.0" dy="17.5" font-size="14" font-weight="400">Eₜ with likelihood</tspan><tspan x="975.0" dy="17.5" font-size="14" font-weight="400">P(Eₜ | Xₜ)</tspan></text>
<text x="700.0" y="773.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#111827" text-anchor="middle"><tspan x="700.0" dy="0.0" font-size="14" font-weight="400">Core idea: temporal inference is not separate from probabilistic reasoning; it is the dynamic case where beliefs are</tspan><tspan x="700.0" dy="17.5" font-size="14" font-weight="400">recursively propagated through time and corrected by new observations.</tspan></text>
<text x="360.0" y="225.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="360.0" dy="0.0" font-size="12" font-weight="700">prior</tspan></text>
<text x="365.0" y="440.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="365.0" dy="0.0" font-size="12" font-weight="700">evidence</tspan></text>
<text x="685.0" y="320.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="685.0" dy="0.0" font-size="12" font-weight="700">update</tspan></text>
<text x="1005.0" y="320.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="1005.0" dy="0.0" font-size="12" font-weight="700">project</tspan><tspan x="1005.0" dy="15.0" font-size="12" font-weight="700">forward</tspan></text>
<text x="715.0" y="476.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="715.0" dy="0.0" font-size="12" font-weight="700">outcomes and context become new</tspan><tspan x="715.0" dy="15.0" font-size="12" font-weight="700">evidence as time passes</tspan></text>
<text x="625.0" y="575.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="625.0" dy="0.0" font-size="12" font-weight="700">propagate</tspan></text>
<text x="860.0" y="575.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="860.0" dy="0.0" font-size="12" font-weight="700">predict</tspan></text>
<text x="1098.0" y="687.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="1098.0" dy="0.0" font-size="12" font-weight="700">correct</tspan></text>
<text x="1070.0" y="459.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" fill="#374151" text-anchor="middle"><tspan x="1070.0" dy="0.0" font-size="12" font-weight="700">posterior as a time-</tspan><tspan x="1070.0" dy="15.0" font-size="12" font-weight="700">indexed belief state</tspan></text>
</svg>