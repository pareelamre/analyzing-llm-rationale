<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1501px" height="821px" viewBox="-0.5 -0.5 1501 821"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="page_background"><g><rect x="0" y="0" width="1500" height="820" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="250" y="22" width="1000" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><text x="750.0" y="43.0" text-anchor="middle" font-size="30" font-weight="bold" font-family="Helvetica" fill="#111111">A representative rationale comparison</text></g></g><g data-cell-id="subtitle"><g><rect x="280" y="66" width="940" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><text x="750.0" y="80.0" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#555555">The same forecasting question and evidence are passed through different rationale parameters</text></g></g><g data-cell-id="case_label"><g><rect x="240" y="124" width="370" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><text x="425.0" y="139.0" text-anchor="middle" font-size="20" font-weight="bold" font-family="Helvetica" fill="#111111">1 Concrete forecasting case</text></g></g><g data-cell-id="question"><g><rect x="240" y="162" width="370" height="156" rx="9.36" ry="9.36" fill="#f5f7fa" stroke="#20262e" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g><g><text x="425.0" y="197.5" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111"><tspan x="425.0" dy="0">Will SpaceX re-use a Starship booster</tspan><tspan x="425.0" dy="21.2">before October 1, 2025?</tspan><tspan x="425.0" dy="21.2"></tspan><tspan x="425.0" dy="21.2">Resolves Yes if a previously flown</tspan><tspan x="425.0" dy="21.2">booster launches before 1 Oct 2025.</tspan></text></g></g><g data-cell-id="evidence"><g><rect x="240" y="340" width="370" height="190" rx="11.4" ry="11.4" fill="#e8f3ee" stroke="#2f6f58" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(232, 243, 238), rgb(23, 33, 29)); stroke: light-dark(rgb(47, 111, 88), rgb(113, 168, 149));"/></g><g><text x="425.0" y="365.0" text-anchor="middle" font-size="16" font-family="Helvetica" fill="#111111"><tspan x="425.0" dy="0">Retrieved evidence</tspan><tspan x="425.0" dy="20.0">Space.com, Sep. 2025: Flight 11 (Oct 13)</tspan><tspan x="425.0" dy="20.0">will re-fly the booster first flown on</tspan><tspan x="425.0" dy="20.0">Flight 8 â€” and notes the earlier</tspan><tspan x="425.0" dy="20.0">Flight 9 reuse (May 27).</tspan><tspan x="425.0" dy="20.0"></tspan><tspan x="425.0" dy="20.0">Other articles report only the upcoming</tspan><tspan x="425.0" dy="20.0">Flight 11 reuse.</tspan></text></g></g><g data-cell-id="prompt_label"><g><rect x="690" y="124" width="410" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><text x="895.0" y="139.0" text-anchor="middle" font-size="20" font-weight="bold" font-family="Helvetica" fill="#111111">2 Rationale parameters</text></g></g><g data-cell-id="same_inputs"><g><rect x="690" y="162" width="568" height="70" rx="4.2" ry="4.2" fill="#eef1f7" stroke="#4b5c78" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(238, 241, 247), rgb(28, 30, 35)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g><g><text x="974.0" y="197.0" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111">Same question, resolution criterion, and evidence</text></g></g><g data-cell-id="v0"><g><rect x="690" y="270" width="184" height="88" rx="5.28" ry="5.28" fill="#ffffff" stroke="#4b5c78" stroke-width="1.3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g><g><text x="782.0" y="303.4" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111"><tspan x="782.0" dy="0">V0 Neutral</tspan><tspan x="782.0" dy="21.2">Brief rationale</tspan></text></g></g><g data-cell-id="v4"><g><rect x="882" y="270" width="184" height="88" rx="5.28" ry="5.28" fill="#ffffff" stroke="#4b5c78" stroke-width="1.3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g><g><text x="974.0" y="292.8" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111"><tspan x="974.0" dy="0">V4 Credibility</tspan><tspan x="974.0" dy="21.2">Assess source</tspan><tspan x="974.0" dy="21.2">reliability</tspan></text></g></g><g data-cell-id="v8"><g><rect x="1074" y="270" width="184" height="88" rx="5.28" ry="5.28" fill="#ffffff" stroke="#4b5c78" stroke-width="1.3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g><g><text x="1166.0" y="292.8" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111"><tspan x="1166.0" dy="0">V8 Temporal</tspan><tspan x="1166.0" dy="21.2">Check event and</tspan><tspan x="1166.0" dy="21.2">deadline</tspan></text></g></g><g data-cell-id="condition_note"><g><rect x="690" y="370" width="568" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><text x="974.0" y="383.0" text-anchor="middle" font-size="15" font-weight="bold" font-family="Helvetica" fill="#4b5c78">Only the requested rationale structure changes</text></g></g><g data-cell-id="outcome_label"><g><rect x="690" y="416" width="350" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><text x="865.0" y="431.0" text-anchor="middle" font-size="20" font-weight="bold" font-family="Helvetica" fill="#111111">3 Forecasts for this case</text></g></g><g data-cell-id="o0"><g><rect x="690" y="460" width="184" height="64" rx="3.84" ry="3.84" fill="#f5f7fa" stroke="#20262e" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g><g><text x="782.0" y="482.6" text-anchor="middle" font-size="15" font-family="Helvetica" fill="#111111"><tspan x="782.0" dy="0">No | c(answer)=0.82</tspan><tspan x="782.0" dy="18.8">Implied P(Yes)=0.18</tspan></text></g></g><g data-cell-id="o4"><g><rect x="882" y="460" width="184" height="64" rx="3.84" ry="3.84" fill="#e8f3ee" stroke="#2f6f58" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(232, 243, 238), rgb(23, 33, 29)); stroke: light-dark(rgb(47, 111, 88), rgb(113, 168, 149));"/></g><g><text x="974.0" y="482.6" text-anchor="middle" font-size="15" font-family="Helvetica" fill="#111111"><tspan x="974.0" dy="0">Yes | c(answer)=0.78</tspan><tspan x="974.0" dy="18.8">P(Yes)=0.78</tspan></text></g></g><g data-cell-id="o8"><g><rect x="1074" y="460" width="184" height="64" rx="3.84" ry="3.84" fill="#e8f3ee" stroke="#2f6f58" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(232, 243, 238), rgb(23, 33, 29)); stroke: light-dark(rgb(47, 111, 88), rgb(113, 168, 149));"/></g><g><text x="1166.0" y="482.6" text-anchor="middle" font-size="15" font-family="Helvetica" fill="#111111"><tspan x="1166.0" dy="0">Yes | c(answer)=0.85</tspan><tspan x="1166.0" dy="18.8">P(Yes)=0.85</tspan></text></g></g><g data-cell-id="truth"><g><rect x="690" y="548" width="568" height="42" rx="2.52" ry="2.52" fill="#dff1e4" stroke="#2f6f58" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(223, 241, 228), rgb(23, 38, 27)); stroke: light-dark(rgb(47, 111, 88), rgb(113, 168, 149));"/></g><g><text x="974.0" y="569.0" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#1f5534">Ground truth: YES | resolved outcome</text></g></g><g data-cell-id="study_label"><g><rect x="240" y="554" width="350" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><text x="415.0" y="569.0" text-anchor="middle" font-size="20" font-weight="bold" font-family="Helvetica" fill="#111111">4 Study-level evaluation</text></g></g><g data-cell-id="study"><g><rect x="240" y="592" width="370" height="146" rx="8.76" ry="8.76" fill="#fffdf5" stroke="#9b7a3d" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(255, 253, 245), rgb(22, 20, 14)); stroke: light-dark(rgb(155, 122, 61), rgb(156, 128, 75));"/></g><g><text x="425.0" y="611.9" text-anchor="middle" font-size="17" font-family="Helvetica" fill="#111111"><tspan x="425.0" dy="0">1,580 questions x 9 prompt conditions</tspan><tspan x="425.0" dy="21.2">x 3 models x 6 temperatures</tspan><tspan x="425.0" dy="21.2"></tspan><tspan x="425.0" dy="21.2">Primary: Brier score, log loss</tspan><tspan x="425.0" dy="21.2">Diagnostics: accuracy, ECE, validity,</tspan><tspan x="425.0" dy="21.2">rationale quality</tspan></text></g></g><g data-cell-id="interpretation"><g><rect x="690" y="614" width="568" height="108" rx="6.48" ry="6.48" fill="#f5f7fa" stroke="#20262e" stroke-width="1.4" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g><g><text x="974.0" y="639.9" text-anchor="middle" font-size="15" font-family="Helvetica" fill="#111111"><tspan x="974.0" dy="0">Interpretation</tspan><tspan x="974.0" dy="18.8">The discrete answer flips from No to Yes, and implied P(Yes) moves</tspan><tspan x="974.0" dy="18.8">from 0.18 to 0.78â€“0.85. V0 anchors on the planned Flight 11 reuse</tspan><tspan x="974.0" dy="18.8">and misses the Flight 9 reuse already in the evidence.</tspan></text></g></g><g data-cell-id="caption"><g><rect x="150" y="742" width="1200" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><text x="750.0" y="754.5" text-anchor="middle" font-size="14" font-family="Helvetica" fill="#444444"><tspan x="750.0" dy="0">Figure 1: Representative case from the forecasting study (Metaculus 29222; GPT-OSS-120B, T=0.75). Boxes reproduce the raw answer and the confidence in that</tspan><tspan x="750.0" dy="17.5">answer, c(answer). For evaluation, No forecasts are converted using P(Yes) = 1 âˆ’ c(answer). Accuracy uses the discrete answer, whereas Brier score and log loss</tspan><tspan x="750.0" dy="17.5">use the implied P(Yes). The example is illustrative; the paper's main claims are based on paired aggregate evaluation.</tspan></text></g></g><g data-cell-id="e_question_evidence"><g><path d="M 425 318 L 425 331.03" fill="none" stroke="#20262e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/><path d="M 425 338.43 L 421.3 331.03 L 428.7 331.03 Z" fill="#20262e" stroke="#20262e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(32, 38, 46), rgb(200, 206, 212)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g></g><g data-cell-id="e_evidence_inputs"><g><path d="M 610 427 L 630 427 L 630 197 L 681.03 197" fill="none" stroke="#20262e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/><path d="M 688.43 197 L 681.03 200.7 L 681.03 193.3 Z" fill="#20262e" stroke="#20262e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(32, 38, 46), rgb(200, 206, 212)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g></g><g data-cell-id="e_inputs_v0"><g><path d="M 974 232 L 974 251 L 782 251 L 782 261.46" fill="none" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/><path d="M 782 268.66 L 778.4 261.46 L 785.6 261.46 Z" fill="#4b5c78" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(75, 92, 120), rgb(146, 161, 185)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g></g><g data-cell-id="e_inputs_v4"><g><path d="M 974 232 L 974 261.46" fill="none" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/><path d="M 974 268.66 L 970.4 261.46 L 977.6 261.46 Z" fill="#4b5c78" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(75, 92, 120), rgb(146, 161, 185)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g></g><g data-cell-id="e_inputs_v8"><g><path d="M 974 232 L 974 251 L 1166 251 L 1166 261.46" fill="none" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/><path d="M 1166 268.66 L 1162.4 261.46 L 1169.6 261.46 Z" fill="#4b5c78" stroke="#4b5c78" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(75, 92, 120), rgb(146, 161, 185)); stroke: light-dark(rgb(75, 92, 120), rgb(146, 161, 185));"/></g></g><g data-cell-id="e_v0_o0"><g><path d="M 782 358 L 782 451.46" fill="none" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/><path d="M 782 458.66 L 778.4 451.46 L 785.6 451.46 Z" fill="#20262e" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(32, 38, 46), rgb(200, 206, 212)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g></g><g data-cell-id="e_v4_o4"><g><path d="M 974 358 L 974 451.46" fill="none" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/><path d="M 974 458.66 L 970.4 451.46 L 977.6 451.46 Z" fill="#20262e" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(32, 38, 46), rgb(200, 206, 212)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g></g><g data-cell-id="e_v8_o8"><g><path d="M 1166 358 L 1166 451.46" fill="none" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/><path d="M 1166 458.66 L 1162.4 451.46 L 1169.6 451.46 Z" fill="#20262e" stroke="#20262e" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(32, 38, 46), rgb(200, 206, 212)); stroke: light-dark(rgb(32, 38, 46), rgb(200, 206, 212));"/></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"></a></switch></svg>